<title>manageLOL Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ============================ tokens ============================ */
:root{
  --bg:#0d1016; --grid:rgba(120,140,170,.04);
  --surface:#151a22; --surface-2:#1b212b; --surface-3:#222a35;
  --line:#2a3340; --line-soft:#1f2530;
  --ink:#e7eaf1; --muted:#93a0b4; --faint:#606d7e;
  --gold:#e3b24d; --gold-deep:#b98a2e; --gold-ghost:rgba(227,178,77,.12);
  --gel:#4bc08d; --toxic:#e46a5e; --info:#65a1e6; --warn:#e0a94a;
  --shadow:0 12px 30px -12px rgba(0,0,0,.6);
  --r:6px; --r-lg:10px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#e7eaf0; --grid:rgba(30,50,90,.05);
  --surface:#ffffff; --surface-2:#f1f4f9; --surface-3:#e7ecf3;
  --line:#d2d9e3; --line-soft:#e4e8ef;
  --ink:#141b28; --muted:#54607394; --muted:#556074; --faint:#8b95a6;
  --gold:#9a7413; --gold-deep:#7d5f0f; --gold-ghost:rgba(154,116,19,.10);
  --gel:#1f9160; --toxic:#c1493d; --info:#2f68c0; --warn:#b57d18;
  --shadow:0 10px 26px -14px rgba(20,30,60,.28);
  color-scheme:light;
}}
:root[data-theme="dark"]{
  --bg:#0d1016; --grid:rgba(120,140,170,.04);
  --surface:#151a22; --surface-2:#1b212b; --surface-3:#222a35;
  --line:#2a3340; --line-soft:#1f2530;
  --ink:#e7eaf1; --muted:#93a0b4; --faint:#606d7e;
  --gold:#e3b24d; --gold-deep:#b98a2e; --gold-ghost:rgba(227,178,77,.12);
  --gel:#4bc08d; --toxic:#e46a5e; --info:#65a1e6; --warn:#e0a94a;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5;
  background-image:radial-gradient(var(--grid) 1px, transparent 1px);
  background-size:22px 22px;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.cond{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
button{font-family:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:3px}
::selection{background:var(--gold-ghost)}

/* ============================ app shell ============================ */
.app{display:grid;grid-template-columns:216px 1fr;grid-template-rows:52px 1fr;height:100vh;height:100dvh}
.topbar{
  grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;
  border-bottom:1px solid var(--line);background:linear-gradient(var(--surface),var(--bg));
}
.brand{font-family:"Barlow Condensed";font-weight:700;font-size:22px;letter-spacing:.02em;line-height:1}
.brand b{color:var(--gold)}
.brand .tag{font-family:"IBM Plex Mono";font-size:9.5px;letter-spacing:.18em;color:var(--faint);
  text-transform:uppercase;display:block;margin-top:1px;font-weight:500}
.stat-strip{margin-left:auto;display:flex;gap:6px;align-items:stretch}
.stat{
  display:flex;flex-direction:column;justify-content:center;padding:4px 12px;min-width:74px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
}
.stat .k{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.stat .v{font-family:"IBM Plex Mono";font-weight:600;font-size:15px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .v.gold{color:var(--gold)}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:var(--r);background:var(--surface)}
.iconbtn:hover{border-color:var(--gold);color:var(--gold)}

/* ---- left rail ---- */
.rail{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;
  padding:12px 10px;gap:3px;overflow:auto}
.nav{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r);color:var(--muted);
  border:1px solid transparent;background:none;width:100%;text-align:left;font-size:13.5px;font-weight:500}
.nav svg{width:17px;height:17px;flex:none;stroke-width:1.7}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav.active{background:var(--gold-ghost);color:var(--gold);border-color:color-mix(in srgb,var(--gold) 30%,transparent)}
.nav .badge{margin-left:auto;font-family:"IBM Plex Mono";font-size:10px;padding:1px 6px;border-radius:20px;
  background:var(--surface-3);color:var(--muted)}
.nav.active .badge{background:var(--gold);color:#1a1206}
.rail-sep{height:1px;background:var(--line-soft);margin:10px 4px}
.rail-title{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);padding:2px 11px 6px}

/* ---- pyramid mini ---- */
.pyr{display:flex;flex-direction:column-reverse;gap:3px;padding:0 8px}
.pyr .step{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;font-size:12px;
  color:var(--faint);border:1px solid transparent;position:relative}
.pyr .dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.pyr .step.done{color:var(--muted)}
.pyr .step.done .dot{background:var(--gel)}
.pyr .step.cur{color:var(--gold);background:var(--gold-ghost);border-color:color-mix(in srgb,var(--gold) 25%,transparent)}
.pyr .step.cur .dot{background:var(--gold);box-shadow:0 0 0 3px var(--gold-ghost)}

/* ---- main ---- */
.main{overflow:auto;padding:20px 24px 40px}
.screen-head{margin-bottom:16px}
.eyebrow{font-family:"IBM Plex Mono";font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 4px}
h1.title{font-family:"Barlow Condensed";font-weight:700;font-size:30px;letter-spacing:.01em;margin:0;line-height:1}
.sub{color:var(--muted);font-size:13px;margin:5px 0 0;max-width:70ch}

/* ============================ generic bits ============================ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:13px}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--gold);color:#1a1206;border-color:var(--gold)}
.btn.primary:hover{filter:brightness(1.06);color:#1a1206}
.btn.ghost{background:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono";font-size:10.5px;
  padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--gel);border-color:color-mix(in srgb,var(--gel) 40%,transparent);background:color-mix(in srgb,var(--gel) 10%,transparent)}
.pill.bad{color:var(--toxic);border-color:color-mix(in srgb,var(--toxic) 40%,transparent);background:color-mix(in srgb,var(--toxic) 10%,transparent)}
.pill.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 40%,transparent);background:color-mix(in srgb,var(--info) 10%,transparent)}
.pill.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent);background:var(--gold-ghost)}
.role-tag{font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* tier gem badge */
.gem{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono";font-size:11px;font-weight:600}
.gem i{width:11px;height:11px;transform:rotate(45deg);border-radius:2px;display:inline-block;
  box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}

/* ============================ scout screen ============================ */
.scout-grid{display:grid;grid-template-columns:1fr 372px;gap:18px;align-items:start}
@media(max-width:1080px){.scout-grid{grid-template-columns:1fr}}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
select,input[type=text]{font-family:inherit;font-size:12.5px;background:var(--surface-2);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--r);padding:6px 9px}
.ladder{width:100%;border-collapse:collapse}
.ladder thead th{font-family:"IBM Plex Mono";font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);text-align:left;padding:0 10px 8px;font-weight:500;position:sticky;top:0;background:var(--bg)}
.ladder td{padding:9px 10px;border-top:1px solid var(--line-soft)}
.ladder tbody tr{cursor:pointer}
.ladder tbody tr:hover{background:var(--surface)}
.ladder tbody tr.sel{background:var(--gold-ghost);box-shadow:inset 2px 0 0 var(--gold)}
.ladder tbody tr.signed{opacity:.42}
.handle{font-family:"Barlow Condensed";font-weight:600;font-size:16.5px;letter-spacing:.01em}
.wr{font-family:"IBM Plex Mono";font-size:12px;color:var(--muted)}
.flagline{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}

/* detail panel */
.detail{position:sticky;top:0}
.detail .dh{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.detail .db{padding:14px 16px}
.detail .empty{padding:40px 20px;text-align:center;color:var(--faint);font-size:13px}
.fog-row{margin:0 0 9px}
.fog-row .lab{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
.fog-row .lab .nm{color:var(--muted)}
.fog-row .lab .rd{font-family:"IBM Plex Mono";font-size:11px;color:var(--ink)}
.track{position:relative;height:8px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.band{position:absolute;top:0;bottom:0;border-radius:5px;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--gold) 55%,transparent),transparent);
  transition:left .5s cubic-bezier(.4,0,.2,1),right .5s cubic-bezier(.4,0,.2,1)}
.band.exact{background:var(--gold)}
.mark{position:absolute;top:-2px;width:2px;height:12px;background:var(--ink);border-radius:2px}
.scoutbar{display:flex;align-items:center;gap:8px;margin:6px 0 14px}
.confbar{flex:1;height:5px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.confbar i{display:block;height:100%;background:var(--info);width:0;transition:width .4s}

/* ============================ squad screen ============================ */
.squad-grid{display:grid;grid-template-columns:1fr 440px;gap:18px;align-items:start}
@media(max-width:1080px){.squad-grid{grid-template-columns:1fr}}
.slot-row{display:flex;flex-direction:column;gap:8px}
.pcard{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px}
.pcard .rl{font-family:"Barlow Condensed";font-weight:700;font-size:12px;color:var(--gold);text-align:center;
  border-right:1px solid var(--line-soft);padding-right:10px;letter-spacing:.05em;text-transform:uppercase}
.pcard .nm{font-family:"Barlow Condensed";font-weight:600;font-size:19px;line-height:1}
.pcard .meta{font-size:11px;color:var(--muted);margin-top:2px}
.ov{font-family:"Barlow Condensed";font-weight:700;font-size:26px;line-height:1;text-align:center}
.ov small{display:block;font-family:"IBM Plex Mono";font-size:8.5px;letter-spacing:.12em;color:var(--faint);font-weight:500}
.mini-bars{display:flex;gap:9px;margin-top:7px;flex-wrap:wrap}
.mb{font-size:10px;color:var(--muted)}
.mb b{font-family:"IBM Plex Mono";color:var(--ink);font-weight:600}
.state-chips{display:flex;gap:5px;margin-top:6px}
.chip{font-family:"IBM Plex Mono";font-size:9.5px;padding:1px 6px;border-radius:4px;background:var(--surface-3);color:var(--muted)}
.slot-empty{display:flex;align-items:center;justify-content:space-between;padding:14px;border:1px dashed var(--line);
  border-radius:var(--r-lg);color:var(--faint);background:repeating-linear-gradient(135deg,transparent,transparent 8px,var(--line-soft) 8px,var(--line-soft) 9px)}

/* chemistry web */
.web-wrap{padding:16px 16px 8px;text-align:center}
.coh-label{font-family:"Barlow Condensed";font-weight:700;font-size:26px;line-height:1;margin-top:4px}
.analyst{font-size:12.5px;color:var(--muted);padding:12px 16px;border-top:1px solid var(--line-soft);line-height:1.55}
.analyst b{color:var(--ink);font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:8px 16px 14px;font-size:10px;color:var(--faint)}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}

/* ============================ compete screen ============================ */
.vs{display:grid;grid-template-columns:1fr 60px 1fr;gap:14px;align-items:center;margin-bottom:16px}
.teamcard{padding:16px}
.teamcard.you{border-color:color-mix(in srgb,var(--gold) 35%,var(--line))}
.teamcard .tn{font-family:"Barlow Condensed";font-weight:700;font-size:22px;line-height:1}
.teamcard .ts{font-family:"Barlow Condensed";font-weight:700;font-size:40px;line-height:1;margin-top:6px}
.teamcard .ts small{font-family:"IBM Plex Mono";font-size:9px;letter-spacing:.12em;color:var(--faint);font-weight:500;display:block}
.vs .mid{text-align:center;font-family:"Barlow Condensed";font-weight:700;color:var(--faint);font-size:18px}
.wpbar{height:26px;border-radius:6px;overflow:hidden;display:flex;border:1px solid var(--line);margin-bottom:16px;font-family:"IBM Plex Mono";font-size:11px;font-weight:600}
.wpbar .you{background:var(--gold-ghost);color:var(--gold);display:flex;align-items:center;padding:0 10px}
.wpbar .opp{background:var(--surface-2);color:var(--muted);display:flex;align-items:center;justify-content:flex-end;padding:0 10px;margin-left:auto}
.games{display:flex;gap:8px;margin-bottom:14px}
.gpip{flex:1;padding:8px;border-radius:6px;border:1px solid var(--line);text-align:center;font-size:11px;color:var(--muted);background:var(--surface)}
.gpip.win{border-color:var(--gel);color:var(--gel)}
.gpip.loss{border-color:var(--toxic);color:var(--toxic)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{padding:8px 0 8px 18px;border-left:2px solid var(--line);position:relative;font-size:12.5px;color:var(--muted);
  opacity:0;transform:translateX(-4px);animation:reveal .35s forwards}
.timeline li:before{content:"";position:absolute;left:-5px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
@keyframes reveal{to{opacity:1;transform:none}}
.statline{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
.statline th{font-family:"IBM Plex Mono";font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:right;padding:4px 8px;font-weight:500}
.statline th:first-child{text-align:left}
.statline td{padding:5px 8px;border-top:1px solid var(--line-soft);text-align:right;font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums}
.statline td:first-child{text-align:left;font-family:"IBM Plex Sans"}
.mvp{color:var(--gold)}

/* ============================ sponsors ============================ */
.sponsor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.sponsor{padding:16px;display:flex;flex-direction:column;gap:8px}
.sponsor .snm{font-family:"Barlow Condensed";font-weight:700;font-size:20px;line-height:1}
.sponsor .flav{font-size:11.5px;color:var(--muted);min-height:32px}
.terms{display:flex;flex-direction:column;gap:5px;font-size:12px;margin:2px 0}
.terms .t{display:flex;justify-content:space-between;color:var(--muted)}
.terms .t b{font-family:"IBM Plex Mono";color:var(--ink);font-weight:600}

/* ============================ draft board ============================ */
.draft{display:grid;grid-template-columns:232px 1fr 300px;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--bg)}
.dhead{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);grid-column:1/4}
.phase-chips{display:flex;gap:6px}
.pchip{font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.1em;padding:3px 9px;border-radius:4px;color:var(--faint);border:1px solid var(--line-soft)}
.pchip.on{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent);background:var(--gold-ghost)}
.dtimer{font-family:"IBM Plex Mono";font-weight:600;font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.dcol{padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface);min-height:560px}
.dcol.you{border-right:1px solid var(--line)} .dcol.them{border-left:1px solid var(--line)}
.dcenter{padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.slot{height:34px;border-radius:5px;border:1px dashed var(--line);display:flex;align-items:center;padding:0 10px;font-family:"Barlow Condensed";font-weight:600;font-size:14px;gap:8px;color:var(--ink)}
.slot.filled{border-style:solid;background:var(--surface-2)}
.slot.ban{text-decoration:line-through;color:var(--muted)}
.slot.now{border-color:var(--gold);background:var(--gold-ghost);color:var(--gold);font-family:"IBM Plex Mono";font-size:10px;font-weight:500;letter-spacing:.1em}
.slot .pf{margin-left:auto;font-family:"IBM Plex Mono";font-size:10px;font-weight:500}
.slot .rt{font-family:"IBM Plex Mono";font-size:9px;color:var(--faint);letter-spacing:.06em}
.bans-row{display:flex;gap:5px} .bans-row .slot{flex:1;height:28px;padding:0 4px;justify-content:center;font-size:11px}
.champ-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:7px;max-height:340px;overflow:auto;padding-right:2px}
.ccard{border-radius:6px;background:var(--surface-2);border:1px solid var(--line);padding:8px 9px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;font-family:inherit;color:inherit}
.ccard:hover{border-color:var(--gold)} .ccard.taken{opacity:.28;cursor:default} .ccard.taken:hover{border-color:var(--line)}
.ccard.top{border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.ccard .cn{display:flex;justify-content:space-between;align-items:baseline;font-family:"Barlow Condensed";font-weight:600;font-size:14.5px;gap:6px}
.ccard .ep{font-size:9px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tierchip{font-family:"IBM Plex Mono";font-size:9px;font-weight:600;flex:none}
.tier-S{color:var(--gold)} .tier-A{color:var(--ink)} .tier-B{color:var(--muted)} .tier-C{color:var(--faint)}
.curve{display:flex;gap:2px;align-items:flex-end;height:12px}
.curve i{display:block;width:9px;border-radius:1px;background:var(--line)} .curve i.hi{background:var(--gold)}
.ccard .pilot{font-family:"IBM Plex Mono";font-size:9px;color:var(--gel)} .ccard .pilot.warn{color:var(--toxic)} .ccard .pilot.off{color:var(--warn)} .ccard .pilot.dim{color:var(--faint)}
.coachbox{border-radius:6px;background:var(--surface);border:1px solid var(--line);padding:10px 12px}
.coachbox .row{display:flex;gap:10px;font-size:12.5px;padding:4px 0;cursor:pointer;border-radius:4px} .coachbox .row:hover{background:var(--surface-2)}
.coachbox .row .v{margin-left:auto;font-family:"IBM Plex Mono";color:var(--gel)}
.compread{border-radius:6px;background:var(--surface-2);border:1px solid var(--line);padding:10px 12px;margin-top:auto}
.compread .lbl{font-family:"Barlow Condensed";font-weight:700;font-size:18px;color:var(--gold);line-height:1.1}
.compread .lbl.them{color:var(--info)}
.clarity{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:6px}
.clarity i{display:block;height:100%;background:var(--gold)} .clarity i.them{background:var(--info)}
.crowd{display:flex;flex-direction:column;min-height:0;flex:1}
.crowd .ch{display:flex;align-items:center;margin-bottom:6px;gap:8px}
.crowd .list{display:flex;flex-direction:column;gap:6px;font-size:11.5px;line-height:1.45;overflow:hidden;flex:1;justify-content:flex-end}
.crowd .u{font-family:"IBM Plex Mono";font-size:10.5px} .crowd .t{color:var(--muted)}
.crowd .m{opacity:0;animation:reveal .3s forwards}
.hype{width:42px;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.hype i{display:block;height:100%;background:var(--toxic)}
.dfoot{grid-column:1/4;display:flex;gap:16px;align-items:center;padding:8px 16px;border-top:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--muted);min-height:36px;flex-wrap:wrap}
.verdict{border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);padding:16px 18px;margin-top:14px}
.verdict .big{font-family:"Barlow Condensed";font-weight:700;font-size:28px;line-height:1}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
.vgrid .k{font-size:12.5px;color:var(--muted);display:flex;gap:8px;padding:3px 0}
.vgrid .k b{margin-left:auto;font-family:"IBM Plex Mono";font-weight:600;color:var(--ink)}
.live{display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start}
@media(max-width:1080px){.live{grid-template-columns:1fr}.draft{grid-template-columns:200px 1fr 260px}}
.scoreb{display:flex;align-items:center;gap:18px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);margin-bottom:12px;flex-wrap:wrap}
.scoreb .tn{font-family:"Barlow Condensed";font-weight:700;font-size:22px} .scoreb .sc{font-family:"Barlow Condensed";font-weight:700;font-size:30px;font-variant-numeric:tabular-nums}
.wp-card,.tl-card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:12px 14px;margin-bottom:12px}
.crowd-card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:12px 14px;min-height:440px;display:flex;flex-direction:column}
.banner{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);margin-bottom:12px}
.banner .big{font-family:"Barlow Condensed";font-weight:700;font-size:26px}

/* comms · pace · live tweaks */
.comms .u{font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.comms .m{padding:2px 0 2px 8px;border-left:2px solid var(--line-soft)}
.comms .m.Frayed{border-left-color:var(--toxic)} .comms .m.Tight{border-left-color:var(--gel)} .comms .m.Ok{border-left-color:var(--gold)}
.comms .list{min-height:150px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface-2);padding:5px 10px;font-size:11px;font-family:"IBM Plex Mono";color:var(--muted);cursor:pointer}
.seg button.on{background:var(--gold);color:#1a1206}
.delib{font-family:"IBM Plex Mono";font-size:11px;color:var(--gold);letter-spacing:.1em}
.delib::after{content:'';display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}100%{content:''}}
.tl-ev{display:flex;gap:10px;padding:5px 0 5px 12px;border-left:2px solid var(--line-soft);font-size:12.5px;color:var(--muted)}
.tl-ev .ts{font-family:"IBM Plex Mono";font-size:11px;color:var(--faint);width:44px;flex:none}
.tl-ev.hl{color:var(--ink);border-left-color:var(--gold)}
.tl-ev.us .ts{color:var(--gold)}
.sbobj{display:flex;gap:14px;font-family:"IBM Plex Mono";font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.delib::after{animation:none;content:'…'}}

/* inbox / log */
.log{display:flex;flex-direction:column;gap:0;max-height:230px;overflow:auto}
.log .li{padding:8px 2px;border-top:1px solid var(--line-soft);font-size:12px;display:flex;gap:9px;align-items:baseline}
.log .li .wk{font-family:"IBM Plex Mono";font-size:10px;color:var(--faint);flex:none;width:38px}
.log .li .tx{color:var(--muted)}
.log .li .tx b{color:var(--ink);font-weight:600}

/* toast */
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:var(--r);
  padding:11px 14px;box-shadow:var(--shadow);max-width:320px;font-size:13px;animation:pop .3s}
.toast.good{border-left-color:var(--gel)} .toast.bad{border-left-color:var(--toxic)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.section-label{font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media(max-width:900px){.grid-2{grid-template-columns:1fr}}
.empty-note{color:var(--faint);font-size:13px;padding:24px;text-align:center}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important}}

/* narrow */
@media(max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:52px auto 1fr}
  .rail{grid-row:2;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:8px}
  .nav{width:auto;white-space:nowrap} .rail-sep,.rail-title,.pyr{display:none}
  .stat-strip .stat:nth-child(n+3){display:none}
}
.seclabel{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 9px}
.seclabel .secsub{font-size:9.5px;color:var(--faint);letter-spacing:.06em;white-space:nowrap}
/* ===================== season · standings · org sheet ===================== */
:root{ --meta:#a98bd6; --cell:34px; }
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){ --meta:#6b4fa8; }}
:root[data-theme="dark"]{ --meta:#a98bd6; }
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.hub{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.hubcol{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:1080px){.hub{grid-template-columns:1fr}}

/* the run strip */
.run{padding:14px 16px 12px}
.runstrip{display:flex;gap:2px;margin:4px 0 8px}
.runcell{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 5px;
  border-radius:5px;position:relative;transition:background .16s}
.runcell .wknum{font-family:"IBM Plex Mono";font-size:9px;color:var(--faint);letter-spacing:.04em}
.runcell .wkico{width:15px;height:15px;color:var(--faint);display:block}
.runcell .wkico svg{width:15px;height:15px;display:block}
.runcell .wkbar{width:70%;height:3px;border-radius:2px;background:var(--line)}
.runcell .wkres{font-family:"IBM Plex Mono";font-size:9.5px;color:var(--faint);line-height:1}
.runcell .wkres.w{color:var(--gel)} .runcell .wkres.l{color:var(--toxic)}
.runcell.k-match .wkbar{background:color-mix(in srgb,var(--gold) 70%,transparent)}
.runcell.k-market .wkbar{background:color-mix(in srgb,var(--info) 70%,transparent)}
.runcell.k-event .wkbar{background:color-mix(in srgb,var(--meta) 70%,transparent)}
.runcell.past{opacity:.55}
.runcell.now{background:var(--gold-ghost);opacity:1}
.runcell.now .wkico,.runcell.now .wknum{color:var(--gold)}
.runcell.now::after{content:"";position:absolute;left:6px;right:6px;bottom:0;height:2px;background:var(--gold);border-radius:2px}
.runlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:var(--faint);letter-spacing:.04em}
.runlegend .lg{display:inline-flex;align-items:center;gap:5px}
.runlegend i{width:12px;height:3px;border-radius:2px;background:var(--line);display:inline-block}
.runlegend .k-match i{background:color-mix(in srgb,var(--gold) 70%,transparent)}
.runlegend .k-market i{background:color-mix(in srgb,var(--info) 70%,transparent)}
.runlegend .k-event i{background:color-mix(in srgb,var(--meta) 70%,transparent)}

/* the fixture card */
.fixture{padding:14px 16px 16px}
.fxvs{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin:8px 0 12px}
.fxside{display:flex;flex-direction:column;align-items:center;gap:3px}
.fxside.r{align-items:center}
.otag{display:inline-block;padding:1px 5px;border:1px solid var(--line);border-radius:3px;font-size:10px;
  letter-spacing:.06em;color:var(--muted);background:var(--surface-2)}
.otag.big{font-size:14px;padding:6px 9px;letter-spacing:.08em;color:var(--ink)}
.fxside .pos{font-size:10px;color:var(--faint)}
.fxmid{text-align:center;min-width:0}
.fxname{display:block;font-family:"Barlow Condensed";font-size:21px;letter-spacing:.01em;color:var(--ink);line-height:1.1}
.fxstat{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.wpsplit{height:7px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.wpsplit i{display:block;height:100%;background:var(--gold)}
.wplabels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin:5px 0 10px}
.fxwarn{font-size:11.5px;color:var(--warn);margin-bottom:10px;line-height:1.45}
.fxlinks{margin-top:9px;text-align:center}
.lnk{color:var(--muted);font-size:11.5px;border-bottom:1px dotted var(--line);cursor:pointer}
.lnk:hover{color:var(--gold);border-bottom-color:var(--gold-deep)}
.btn.wide{width:100%;justify-content:center;padding:11px}
.weekbody{margin:6px 0 12px}
.wknote{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0 0 8px}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-top:1px solid var(--line-soft);font-size:12px;color:var(--muted)}
.kv b{color:var(--ink);font-size:12.5px}

/* the standings table */
.table-card{padding:0;overflow:hidden}
.tablehead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:13px 15px 10px}
.tablehead h3{margin:0;font-family:"Barlow Condensed";font-size:19px;letter-spacing:.02em}
.tablehead .sub{margin:2px 0 0;font-size:11px}
.roundchip{flex:none;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:3px 7px;letter-spacing:.06em}
table.standings{width:100%;border-collapse:collapse;table-layout:fixed}
table.standings th{font-family:"IBM Plex Mono";font-size:9px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);text-align:left;padding:0 10px 7px;border-bottom:1px solid var(--line)}
table.standings th.r{text-align:right}
table.standings td{padding:7px 10px;font-size:12px;border-top:1px solid var(--line-soft);height:34px;vertical-align:middle}
table.standings td.r{text-align:right}
table.standings tbody tr{cursor:pointer;transition:background .12s}
table.standings tbody tr:not(.cutrow):hover{background:var(--surface-2)}
table.standings tbody tr.you{background:var(--gold-ghost);box-shadow:inset 2px 0 0 var(--gold)}
table.standings tbody tr.you .oname{color:var(--gold)}
table.standings tbody tr.you .otag{color:var(--ink);border-color:var(--gold-deep);background:var(--gold-ghost)}
.standings .pos{color:var(--muted);text-align:center}
.standings .orgcell{display:flex;align-items:center;gap:7px;overflow:hidden}
.standings .oname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.standings .laurel{color:var(--gold-deep);font-size:10px;flex:none}
.standings .gd em{font-style:normal}
.standings .gd em.up{color:var(--gel)} .standings .gd em.dn{color:var(--toxic)}
.standings .wr{font-size:12.5px;color:var(--ink)}
.mv{font-family:"IBM Plex Mono";font-size:10px;text-align:center;color:var(--faint);display:block}
.mv.up{color:var(--gel)} .mv.dn{color:var(--toxic)}
.form{display:flex;gap:4px;align-items:center}
.form i{width:7px;height:7px;border-radius:50%;flex:none}
.form i.w{background:var(--gel)}
.form i.l{background:transparent;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--toxic) 65%,transparent)}
.form i.n{background:var(--line)}
tr.cutrow{cursor:default}
tr.cutrow td{padding:0;height:18px;position:relative;border:0}
tr.cutrow td::before{content:"";position:absolute;left:0;right:0;top:8px;height:1px;
  background:repeating-linear-gradient(90deg,var(--c) 0 5px,transparent 5px 10px)}
tr.cutrow span{position:relative;display:inline-block;margin-left:30px;padding:0 7px;background:var(--surface);
  font-family:"IBM Plex Mono";font-size:8.5px;letter-spacing:.16em;color:var(--c);text-transform:uppercase}
tr.cutrow.up{--c:color-mix(in srgb,var(--gold) 62%,transparent)}
tr.cutrow.down{--c:color-mix(in srgb,var(--toxic) 58%,transparent)}

/* side cards */
.formlist,.pyrlist,.desk{display:flex;flex-direction:column}
.formrow{display:grid;grid-template-columns:26px 14px 34px 1fr auto;gap:8px;align-items:center;
  padding:6px 0;border-top:1px solid var(--line-soft);font-size:11.5px}
.formrow .rnd{color:var(--faint);font-size:10px}
.formrow .res.w{color:var(--gel)} .formrow .res.l{color:var(--toxic)}
.formrow .score{color:var(--ink)}
.formrow .side{color:var(--faint);font-size:10px;letter-spacing:.05em}
.pyrrow{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:7px 0;
  border-top:1px solid var(--line-soft);font-size:12px;color:var(--muted)}
.pyrrow .tno{color:var(--faint);font-size:10px}
.pyrrow.here{color:var(--ink)}
.pyrrow.here .tno{color:var(--gold)}
.pyrrow.here .tname{color:var(--gold)}
.pyrrow .tnote{font-size:10.5px;color:var(--faint)}
.deskrow{display:grid;grid-template-columns:6px 1fr auto;gap:9px;align-items:baseline;padding:7px 0;
  border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--muted);line-height:1.45}
.deskrow .dglyph{width:5px;height:5px;border-radius:50%;background:var(--line);align-self:center}
.deskrow.unread .dglyph{background:var(--gold)}
.deskrow.unread .dtx{color:var(--ink)}
.deskrow.k-good .dglyph{background:var(--gel)}
.deskrow.k-bad .dglyph{background:var(--toxic)}
.deskrow .dwk{font-size:9.5px;color:var(--faint);white-space:nowrap}

/* org sheet */
.orgsheet{position:absolute;inset:0;background:var(--bg);overflow:auto;padding:20px 24px 40px;z-index:30;
  animation:sheetIn .18s cubic-bezier(.4,0,.2,1)}
@keyframes sheetIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sheetclose{position:absolute;top:16px;right:20px;font-size:15px}
.osheet-head{display:grid;grid-template-columns:auto 1fr 200px;gap:18px;align-items:start;margin-bottom:16px;padding-right:40px}
.crest{width:62px;height:62px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface-2);
  display:flex;align-items:center;justify-content:center}
.crest span{font-size:15px;letter-spacing:.1em;color:var(--gold)}
.oid h2{margin:0;font-family:"Barlow Condensed";font-size:30px;letter-spacing:.01em;line-height:1.05}
.oid .blurb{margin:6px 0 0;font-size:12.5px;color:var(--muted);font-style:italic;line-height:1.5;max-width:52ch}
.prestigebox{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:11px 13px;text-align:center}
.prestigebox .pval{display:block;font-size:30px;color:var(--gold);line-height:1}
.prestigebox .plabel{display:block;font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);margin-top:3px}
.prestigebox .pstature{display:block;font-family:"Barlow Condensed";font-size:15px;color:var(--ink);margin-top:5px;letter-spacing:.03em}
.prestigebox .pbar{display:block;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin:7px 0 5px}
.prestigebox .pbar i{display:block;height:100%;background:var(--gold)}
.prestigebox .psplit{display:block;font-size:9.5px;color:var(--faint)}
.spine{margin-bottom:14px}
.spinegrid{display:flex;flex-direction:column;gap:3px;margin:6px 0 10px}
.spinerow{display:grid;grid-template-columns:26px 1fr 30px;gap:9px;align-items:center}
.spinerow .tno{font-size:10px;color:var(--faint)}
.spinerow .cells{display:flex;gap:2px;flex-wrap:wrap}
.spinerow .cells i{width:9px;height:13px;border-radius:2px;background:var(--surface-3);display:block}
.spinerow .cells i.title{background:var(--gold)}
.spinerow .tcount{font-size:10px;color:var(--faint);text-align:right}
.honors{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);padding-top:9px;border-top:1px solid var(--line-soft)}
.osheet-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:900px){.osheet-cols,.osheet-head{grid-template-columns:1fr}}
.orgroster .orow{display:grid;grid-template-columns:34px 1fr 24px 28px 60px 34px;gap:8px;align-items:center;
  padding:7px 0;border-top:1px solid var(--line-soft);font-size:12px}
.orgroster .oname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orgroster .oage,.orgroster .oterm{color:var(--faint);font-size:10.5px;text-align:right}
.orgroster .oca{color:var(--gold);text-align:right}
.orgroster .oempty{color:var(--faint);font-style:italic}
.termbar{position:relative;height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.termbar i{display:block;height:100%;background:color-mix(in srgb,var(--gold) 55%,transparent)}
.termbar.warn i{background:var(--warn)}
.termbar.crit i{background:var(--toxic)}
.orgread .oread{display:grid;grid-template-columns:78px 1fr 74px;gap:10px;align-items:center;
  padding:7px 0;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--muted)}
.orgread .oread .mono{font-size:10.5px;color:var(--ink);text-align:right}

/* the ledger strip on Squad */
.wagestrip{display:flex;align-items:center;gap:14px;padding:10px 14px;margin-bottom:14px;flex-wrap:wrap;
  border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);font-size:11.5px;color:var(--muted)}
.wagestrip b{color:var(--ink);font-family:"IBM Plex Mono";font-size:12px}
.wagestrip .bar{flex:1;min-width:120px;height:8px;border-radius:5px;background:var(--surface-3);overflow:hidden;display:flex}
.wagestrip .bar i{height:100%;background:var(--gold)}
.wagestrip.tight{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.wagestrip.critical,.wagestrip.insolvent{border-color:color-mix(in srgb,var(--toxic) 55%,var(--line))}
.wagestrip.critical .bar i,.wagestrip.insolvent .bar i{background:var(--toxic)}
.wagestrip .state{letter-spacing:.14em;text-transform:uppercase;font-size:9px}
.contractlane{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:8px 0 2px;font-size:10.5px;color:var(--faint)}
.contractlane .mono{color:var(--muted)}

/* the continue button in the topbar */
.continue{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 13px;border-radius:var(--r);
  border:1px solid var(--gold-deep);background:var(--gold-ghost);color:var(--gold);cursor:pointer;min-width:168px;
  transition:background .14s,transform .1s}
.continue:hover{background:color-mix(in srgb,var(--gold) 18%,transparent)}
.continue:active{transform:translateY(1px)}
.continue .verb{font-family:"Barlow Condensed";font-size:15px;letter-spacing:.03em;line-height:1.1}
.continue .csub{font-family:"IBM Plex Mono";font-size:9px;color:var(--muted);letter-spacing:.04em}
.bell{position:relative}
.bell .count{position:absolute;top:-3px;right:-3px;min-width:14px;height:14px;border-radius:8px;background:var(--gold);
  color:var(--bg);font-family:"IBM Plex Mono";font-size:9px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:88vw;background:var(--surface);z-index:60;
  border-left:1px solid var(--line);box-shadow:var(--shadow);overflow:auto;padding:18px 18px 30px;
  animation:drawerIn .2s cubic-bezier(.4,0,.2,1)}
@keyframes drawerIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.drawer h3{margin:0 0 3px;font-family:"Barlow Condensed";font-size:21px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}

/* the Open: the tournament board */
.board{padding:14px 16px 10px}
.evrow{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;
  padding:12px 0;border-top:1px solid var(--line-soft)}
.evrow:first-of-type{border-top:0}
.evmain{min-width:0}
.evname{display:block;font-family:"Barlow Condensed";font-size:19px;letter-spacing:.02em;color:var(--ink);line-height:1.15}
.evlock{font-size:11px;opacity:.55;vertical-align:2px}
.evblurb{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.evfacts{display:flex;flex-direction:column;gap:2px;text-align:right;font-size:10px;color:var(--faint);white-space:nowrap}
.evfacts .evprize{color:var(--gold)}
.evact{min-width:118px;text-align:right}
.evact .btn{font-size:12px;padding:7px 12px}
.evgate,.evwhen{font-size:10px;color:var(--faint);line-height:1.5;display:inline-block}
.evgate b{color:var(--gold);font-size:11px}
/* Locked reads as distant, never as broken: the name and the prize stay fully
   legible, because that rung is the thing being climbed toward. */
.evrow.locked .evname{color:var(--muted)}
.evrow.locked .evblurb{opacity:.6}
.evrow.locked .evfacts{opacity:.55}

<script>
/* manageLOL — self-contained sim (faithful JS port of @managelol/core).
   Same algorithms as packages/core; kept dependency-free for the prototype. */
(function (root) {
  'use strict';

  // ---------- RNG (xmur3 + mulberry32) ----------
  function xmur3(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function () {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      h ^= h >>> 16;
      return h >>> 0;
    };
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

  function Rng(seed, stream) {
    const s = xmur3(seed + '::' + stream);

  }

  Rng.prototype.range = function (lo, hi) { return lo + (hi - lo) * this.next(); };
  Rng.prototype.int = function (lo, hi) { return Math.floor(this.range(lo, hi + 1)); };
  Rng.prototype.chance = function (p) { return this.next() < Math.max(0, Math.min(1, p)); };
  Rng.prototype.pick = function (arr) { return arr[Math.floor(this.next() * arr.length)]; };

  // ---------- content: roles / archetypes / regions ----------

    top: ['tankEngage', 'skirmisher', 'splitPush', 'controlMage'],
    jungle: ['earlyJungle', 'skirmisher', 'assassin', 'tankEngage', 'catcher'],
    mid: ['assassin', 'controlMage', 'scalingCarry', 'poke', 'laneBully'],
    bot: ['scalingCarry', 'laneBully', 'poke'],
    support: ['enchanter', 'catcher', 'tankEngage'],
  };
  const REGIONS = {
    kyo: { name: 'Kyorin', wealth: 1.05, langs: ['kyoril', 'common'], bias: { mechanics: 8, reflexes: 7, laning: 6, waveManagement: 5, consistency: 4, professionalism: 6, workEthic: 6, streamAppeal: -3 }, on: ['Se', 'Ky', 'Ji', 'Ha', 'Do', 'Mu', 'Ry', 'Ta', 'Wo', 'Bi', 'Gu', 'Sh'], nu: ['a', 'eo', 'u', 'i', 'o', 'ae', 'ya'], co: ['n', 'k', 'ng', 'l', 'm', 'ru', 'ho', ''] },
    tia: { name: 'Tianxu', wealth: 1.5, langs: ['tianhua', 'common'], bias: { teamfighting: 7, playstyleAggression: 10, mechanics: 5, objectiveControl: 5, ego: 5, ambition: 6, mapAwareness: -2 }, on: ['Xi', 'Zh', 'Ru', 'Ka', 'Ll', 'Sh', 'Ti', 'Ya', 'Fo', 'We', 'Ji', 'Ma'], nu: ['a', 'ao', 'e', 'ai', 'ou', 'u', 'ei'], co: ['n', 'ng', 'o', 'i', 'x', 'ge', 'ke', ''] },
    mer: { name: 'Meridia', wealth: 1.1, langs: ['meric', 'auran', 'common'], bias: { rotations: 7, shotcalling: 6, adaptability: 6, visionControl: 5, leadership: 5, communication: 6, mediaHandling: 4, mechanics: -3 }, on: ['Ca', 'Vi', 'Lu', 'Ma', 'Re', 'Th', 'Ni', 'Ga', 'Br', 'El', 'Or', 'Fe'], nu: ['a', 'e', 'i', 'o', 'au', 'ie', 'ea'], co: ['s', 'x', 'n', 'r', 'z', 'll', 'ne', ''] },
    van: { name: 'Vantia', wealth: 1.55, langs: ['vanto', 'common'], bias: { starPower: 8, streamAppeal: 10, marketability: 8, fanbase: 6, ego: 4, mechanics: -2, professionalism: -3, consistency: -3 }, on: ['Ja', 'Ma', 'Da', 'Ko', 'Ze', 'Ni', 'Bl', 'Tr', 'Sn', 'Vi', 'Ra', 'Cl'], nu: ['a', 'e', 'i', 'o', 'u', 'ay', 'oo'], co: ['x', 'z', 'n', 'r', 'sh', 'ke', 'per', ''] },

  function handle(rng, reg) {
    const syl = () => rng.pick(reg.on) + rng.pick(reg.nu) + rng.pick(reg.co);

  // ---------- player generation ----------
  function genPlayer(rng, opts) {
    const reg = REGIONS[opts.region];
    const bias = reg.bias, c = opts.qualityCenter, sd = opts.spread || 8;

    const roleApt = {};

    const bestOff = Math.max.apply(null, ROLES.filter((r) => r !== primaryRole).map((r) => roleApt[r]));
    roleApt[primaryRole] = c100(Math.max(rng.gaussian(c + 12, 6), bestOff + rng.range(2, 8)));
    const secondaryRole = ROLES.filter((r) => r !== primaryRole).sort((x, y) => roleApt[y] - roleApt[x])[0];

    const champ = {};

    const peakAge = rng.int(20, 24), declineStartAge = peakAge + rng.int(1, 4);

    const gapMean = yearsToPeak * 2.2 + (bias.potential || 0);
    const reflexYouth = c100((peakAge - age) * 1.3);
    const A = {
      mechanical: { mechanics: b('mechanics'), laning: b('laning'), teamfighting: b('teamfighting'), reflexes: c100(c100(rng.gaussian(c + (bias.reflexes || 0), sd)) + reflexYouth - 4), positioning: b('positioning') },
      gameKnowledge: { mapAwareness: b('mapAwareness'), waveManagement: b('waveManagement'), objectiveControl: b('objectiveControl'), visionControl: b('visionControl'), rotations: b('rotations'), adaptability: b('adaptability'), shotcalling: b('shotcalling') },
      mental: { composure: b('composure'), consistency: b('consistency'), focus: b('focus'), clutch: c100(rng.gaussian(50, 18)), tiltResistance: c100(rng.gaussian(52, 16)) },
      roleAptitude: { primaryRole: primaryRole, secondaryRole: secondaryRole, top: roleApt.top, jungle: roleApt.jungle, mid: roleApt.mid, bot: roleApt.bot, support: roleApt.support, roleFlexibility: c100(rng.gaussian(45, 18)) },
      championAptitude: champ,
      growth: { potential: 0, growthRate: c100(rng.gaussian(60, 15)), peakAge: peakAge, declineStartAge: declineStartAge, declineRate: c100(rng.gaussian(50, 15)), mechanicalDeclineBias: Math.max(0.3, rng.gaussian(1.1, 0.35)), learningRate: c100(rng.gaussian(58, 15)), workEthic: b('workEthic'), burnoutProneness: c100(rng.gaussian(45, 18)) },
      personality: { ambition: b('ambition'), loyalty: c100(rng.gaussian(50, 20)), professionalism: b('professionalism') },
      chemistry: { communication: b('communication'), leadership: c100(rng.gaussian(45, 18)), ego: c100(rng.gaussian(45, 18) + (bias.ego || 0)), temperament: c100(rng.gaussian(50, 20)), coachability: c100(rng.gaussian(55, 18)), introversion: c100(rng.gaussian(52, 20)), mentorship: c100(rng.gaussian(40, 18) + Math.max(0, age - 22) * 2), teamplayOrientation: c100(rng.gaussian(52, 18)), playstyleAggression: b('playstyleAggression'), playstyleTempo: c100(rng.gaussian(50, 20)), playstyleRiskTaking: b('playstyleRiskTaking'), preferredArchetype: preferredArchetype },
      brand: { starPower: c100(rng.gaussian(30, 15) + (bias.starPower || 0)), streamAppeal: b('streamAppeal'), fanbase: c100(rng.gaussian(25, 15) + (bias.fanbase || 0)), marketability: b('marketability'), mediaHandling: b('mediaHandling') },

      nationality: opts.region, languageIds: langs, attributes: A,
      state: { form: Math.round(rng.gaussian(50, 8)), fatigue: Math.round(c100(rng.gaussian(15, 10))), morale: Math.round(c100(rng.gaussian(58, 12))), sharpness: Math.round(c100(rng.gaussian(70, 15))) },

  }

  // ---------- ratings ----------

    const m = A.mechanical, k = A.gameKnowledge, mn = A.mental;

  const fatigueMult = (s) => 1 - (s.fatigue / 100) * 0.25;

  const effRoleMult = (A, r) => roleMult(A, r) * discomfort(A, r);
  const ROLE_W = {
    top: { laning: 0.35, mechanics: 0.2, waveManagement: 0.15, teamfighting: 0.15, mapAwareness: 0.15 },
    jungle: { mapAwareness: 0.3, objectiveControl: 0.25, mechanics: 0.2, teamfighting: 0.15, waveManagement: 0.1 },
    mid: { laning: 0.35, mechanics: 0.25, waveManagement: 0.15, mapAwareness: 0.15, teamfighting: 0.1 },
    bot: { laning: 0.3, mechanics: 0.25, teamfighting: 0.25, positioning: 0.15, waveManagement: 0.05 },
    support: { visionControl: 0.25, mapAwareness: 0.2, teamfighting: 0.2, objectiveControl: 0.15, positioning: 0.1, mechanics: 0.1 },
  };

  S.CHAMP_BY_ID = {}; S.CHAMPIONS.forEach((c) => (S.CHAMP_BY_ID[c.id] = c));

  // ---------- meta ----------
  S.genPatch = function (rng, index, prev) {
    const archDelta = {};
    ARCHES.forEach((a) => { const p = prev ? prev.archDelta[a] || 0 : 0; archDelta[a] = clamp(0.6 * p + rng.gaussian(0, 4), -10, 10); });
    const outliers = {}; const ids = S.CHAMPIONS.map((c) => c.id).sort(); const n = rng.int(3, 5);
    for (let i = 0; i < n; i++) { const id = rng.pick(ids); outliers[id] = clamp(Math.round(rng.gaussian(0, 7)), -10, 10); }
    return { index: index, archDelta: archDelta, outliers: outliers };
  };
  S.champStrength = function (c, patch) {
    let s = c.basePower;
    for (const a in c.styleTags) s += (patch.archDelta[a] || 0) * c.styleTags[a];
    s += patch.outliers[c.id] || 0;
    return clamp(s, 20, 90);
  };
  S.tierOf = (s) => (s >= 62 ? 'S' : s >= 55 ? 'A' : s >= 47 ? 'B' : 'C');

  // ---------- champion pool ----------
  function profCeiling(apt, tags) { let m = 0; for (const a in tags) m += (apt[a] || 0) * tags[a]; return clamp(100 * (0.4 + 0.6 * m / 100), 0, 100); }
  S.seedPool = function (player, rng) {
    const ra = player.attributes.roleAptitude, learning = player.attributes.growth.learningRate / 100, pref = player.attributes.chemistry.preferredArchetype;
    player.championPool = {};
    S.CHAMPIONS.forEach((c) => {
      const ceiling = profCeiling(player.attributes.championAptitude, c.styleTags);
      let frac;
      if (c.roles.indexOf(ra.primaryRole) >= 0) frac = 0.45 + 0.5 * rng.float() * (0.6 + 0.4 * learning);
      else if (c.roles.indexOf(ra.secondaryRole) >= 0) frac = 0.3 + 0.3 * rng.float();
      else frac = 0.15 + 0.2 * rng.float();
      if ((c.styleTags[pref] || 0) >= 0.5) frac = Math.min(1, frac + 0.15);
      player.championPool[c.id] = round(clamp(ceiling * frac, 0, 100), 0);
    });
  };
  S.prof = (player, id) => (player.championPool && player.championPool[id] !== undefined ? player.championPool[id] : 20);

  // ---------- draft ----------
  const B = 'blue', R = 'red';
  S.DRAFT_SEQUENCE = [
    { side: B, type: 'ban' }, { side: R, type: 'ban' }, { side: B, type: 'ban' }, { side: R, type: 'ban' }, { side: B, type: 'ban' }, { side: R, type: 'ban' },
    { side: B, type: 'pick' }, { side: R, type: 'pick' }, { side: R, type: 'pick' }, { side: B, type: 'pick' }, { side: B, type: 'pick' }, { side: R, type: 'pick' },
    { side: R, type: 'ban' }, { side: B, type: 'ban' }, { side: R, type: 'ban' }, { side: B, type: 'ban' },
    { side: R, type: 'pick' }, { side: B, type: 'pick' }, { side: B, type: 'pick' }, { side: R, type: 'pick' },
  ];
  S.newDraft = () => ({ step: 0, bans: { blue: [], red: [] }, picks: { blue: [], red: [] } });
  S.currentStep = (s) => S.DRAFT_SEQUENCE[s.step] || null;
  S.isComplete = (s) => s.step >= S.DRAFT_SEQUENCE.length;
  S.takenIds = function (s) { const t = {}; [B, R].forEach((side) => { s.bans[side].forEach((id) => (t[id] = 1)); s.picks[side].forEach((p) => (t[p.champId] = 1)); }); return t; };
  S.openRoles = function (s, side) { const f = {}; s.picks[side].forEach((p) => (f[p.role] = 1)); return ROLES.filter((r) => !f[r]); };
  S.assignRole = function (c, open) { for (const r of c.roles) if (open.indexOf(r) >= 0) return { role: r, offRole: false }; return open.length ? { role: open[0], offRole: true } : null; };
  S.legalActions = function (s) { const t = S.takenIds(s); return S.CHAMPIONS.map((c) => c.id).filter((id) => !t[id]).sort(); };
  S.applyAction = function (s, champId, team) {
    const step = S.currentStep(s); if (!step) throw new Error('draft complete');
    if (S.takenIds(s)[champId]) throw new Error('taken');
    const c = S.CHAMP_BY_ID[champId];
    const next = { step: s.step + 1, bans: { blue: s.bans.blue.slice(), red: s.bans.red.slice() }, picks: { blue: s.picks.blue.slice(), red: s.picks.red.slice() } };
    if (step.type === 'ban') next.bans[step.side].push(champId);
    else { const a = S.assignRole(c, S.openRoles(s, step.side)); next.picks[step.side].push({ champId: champId, role: a.role, playerId: team.lineup[a.role].id, offRole: a.offRole }); }

    const leapChance = age < 22 ? 0.018 * headroom * (S.supportScore(ctx) / 100) : 0;

      ? { mechanical: 0.75 + 0.25 * (a.growth.mechanicalDeclineBias / 100), knowledge: -0.18, mental: -0.05 }

      const block = canon.filter((r) => r.wins === w);
      if (block.length === 1) { out.push(block[0]); return; }

    const draftSigma = 1.9 - 0.85 * ((a.drafting + b.drafting) / 200);

      }
    }
    const first = matches.filter((m) => m.round === 1);
    first.forEach((m, i) => {
      m.seedA = order[i * 2]; m.seedB = order[i * 2 + 1];
      m.a = teamOfSeed(m.seedA); m.b = teamOfSeed(m.seedB);
    });
    const drop = {};
    first.forEach((m) => {
      if (m.a !== null && m.b !== null) return;
      const through = m.a !== null ? m.a : m.b;
      const seed = m.a !== null ? m.seedA : m.seedB;
      drop[m.id] = 1;
      if (through === null || !m.feedsInto) return;
      const next = byId[m.feedsInto];
      if (m.feedsSlot === 'a') { next.a = through; next.seedA = seed; }
      else { next.b = through; next.seedB = seed; }
    });
    const live = matches.filter((m) => !drop[m.id] && (m.round > 1 || (m.a !== null && m.b !== null)));
    return { teams: teams.slice(), bestOf: bestOf, matches: live, champion: null, rounds: rounds };
  };

  S.pendingMatches = (b) => b.matches.filter((m) => m.winner === null && m.a !== null && m.b !== null);
  S.nextMatchFor = (b, orgId) => S.pendingMatches(b).filter((m) => m.a === orgId || m.b === orgId)[0] || null;
  S.recordBracketResult = function (b, matchId, winner, score) {
    const m = b.matches.filter((x) => x.id === matchId)[0];
    if (!m || m.winner !== null) return;
    m.winner = winner; m.score = score;
    const seed = winner === m.a ? m.seedA : m.seedB;
    if (!m.feedsInto) { b.champion = winner; return; }
    const next = b.matches.filter((x) => x.id === m.feedsInto)[0];
    if (!next) { b.champion = winner; return; }
    if (m.feedsSlot === 'a') { next.a = winner; next.seedA = seed; }
    else { next.b = winner; next.seedB = seed; }
  };
  S.playBracket = function (b, resolve, rng, skip) {
    const played = [];
    for (let guard = 0; guard < b.matches.length + 2; guard++) {
      const ready = S.pendingMatches(b).filter((m) => skip === undefined || (m.a !== skip && m.b !== skip));
      if (!ready.length) break;
      ready.sort((x, y) => (x.id < y.id ? -1 : 1));
      ready.forEach((m) => {
        const out = resolve(m, rng);
        S.recordBracketResult(b, m.id, out.winner, out.score);
        played.push(m);
      });
    }
    return played;
  };
  S.bracketPlacings = function (b) {
    const out = [];
    if (b.champion) out.push(b.champion);
    b.matches.filter((m) => m.winner !== null)
      .slice().sort((x, y) => (y.round !== x.round ? y.round - x.round : x.seedA - y.seedA))
      .forEach((m) => { const l = m.winner === m.a ? m.b : m.a; if (l !== null && out.indexOf(l) < 0) out.push(l); });
    b.teams.forEach((t) => { if (out.indexOf(t) < 0) out.push(t); });
    return out;
  };
  S.buildGauntlet = (defender, challenger) => ({ defender: defender, challenger: challenger, bestOf: 5, winner: null, score: null });
  S.gauntletPromoted = (g) => g.winner !== null && g.winner === g.challenger;

  /* ---------- The Open: the amateur circuit ---------- */
  S.CIRCUIT = [
    { id: 'weekend', name: 'Weekend Open', entryFee: 1, fieldSize: 8, bestOf: 1, finalBestOf: 3,
      repGate: 0, repCap: 18,
      purse: { winner: 6, finalist: 2.5, semi: 1, quarter: 0.4, entered: 0 },
      points: { winner: 100, finalist: 60, semi: 35, quarter: 18, entered: 6 },
      repBase: { winner: 3, finalist: 1.6, semi: 0.8, quarter: 0.35, entered: 0.1 },
      fixedWeeks: [3, 4, 5, 6, 7, 8, 9, 10, 11, 20, 21, 22, 23, 24, 25, 26, 27, 28],
      blurb: 'Eight teams, one Saturday, one game a round. Everyone starts here.' },
    { id: 'contenders', name: 'Contenders Cup', entryFee: 3, fieldSize: 16, bestOf: 1, finalBestOf: 3,
      repGate: 12, repCap: 38,
      purse: { winner: 22, finalist: 10, semi: 4.5, quarter: 2, entered: 0 },
      points: { winner: 260, finalist: 150, semi: 85, quarter: 42, entered: 12 },
      repBase: { winner: 10, finalist: 5.5, semi: 2.6, quarter: 1.2, entered: 0.35 },
      fixedWeeks: [6, 11, 17, 23, 28, 34],
      blurb: 'Sixteen teams and a month of bragging rights. Where a name gets made.' },
    { id: 'gateway', name: 'The Gateway', entryFee: 5, fieldSize: 16, bestOf: 3, finalBestOf: 5,
      repGate: 36, repCap: 68,
      purse: { winner: 40, finalist: 18, semi: 8, quarter: 3, entered: 0 },
      points: { winner: 500, finalist: 300, semi: 170, quarter: 85, entered: 25 },
      repBase: { winner: 13, finalist: 7, semi: 3.5, quarter: 1.5, entered: 0.4 },
      fixedWeeks: [19, 42],
      blurb: 'Sixteen teams. The winner takes a seat in the Regional Circuit.' },
  ];
  S.EVENT_BY_RUNG = {}; S.CIRCUIT.forEach((e) => (S.EVENT_BY_RUNG[e.id] = e));
  S.GATEWAY_PRIZE_TIER = 3;
  S.GRASSROOTS_STIPEND = 0.5;
  S.OPEN_WAGE_MULT = 0.4;
  S.OPEN_QUALITY_CENTRE = 60;
  S.SEAT_BUY_IN_COST = 140;
  S.SEAT_BUY_IN_REP = 20;

  S.repGain = (event, place, rep) => round(event.repBase[place] * clamp(1 - rep / event.repCap, 0, 1), 3);
  S.canEnter = function (event, o) {
    if (!o.rosterFilled) return { allowed: false, reason: 'roster', repShort: 0 };
    if (o.reputation < event.repGate) return { allowed: false, reason: 'reputation', repShort: round(event.repGate - o.reputation, 1) };
    if (o.cash < event.entryFee) return { allowed: false, reason: 'money', repShort: 0 };
    return { allowed: true, reason: 'ok', repShort: 0 };
  };
  S.nextUnlock = function (rep) {
    for (let i = 0; i < S.CIRCUIT.length; i++) {
      if (rep < S.CIRCUIT[i].repGate) return { event: S.CIRCUIT[i], short: round(S.CIRCUIT[i].repGate - rep, 1) };
    }
    return null;
  };
  S.eventsInWeek = (week) => S.CIRCUIT.filter((e) => e.fixedWeeks.indexOf(week) >= 0)
    .sort((a, b) => S.CIRCUIT.indexOf(b) - S.CIRCUIT.indexOf(a));
  S.placementOf = function (rounds, exitRound, won) {
    if (won) return 'winner';
    const fromEnd = rounds - exitRound;
    if (fromEnd === 0) return 'finalist';
    if (fromEnd === 1) return 'semi';
    if (fromEnd === 2) return 'quarter';
    return 'entered';
  };
  S.rewardFor = (event, place, rep) => ({
    cash: round(event.purse[place] - event.entryFee, 2),
    points: event.points[place],
    reputation: S.repGain(event, place, rep),
  });
  S.seatOfferFor = function (tier, vacatedBy, week) {
    const mult = ({ 1: 4, 2: 2.2, 3: 1, 4: 1 })[tier];
    return { tier: tier, vacatedBy: vacatedBy, cost: round(S.SEAT_BUY_IN_COST * mult, 0),
      repRequired: round(S.SEAT_BUY_IN_REP * mult, 0), expiresWeek: week + 3 };
  };
  S.canBuySeat = function (offer, o) {
    if (o.reputation < offer.repRequired) return { allowed: false, reason: 'reputation', repShort: round(offer.repRequired - o.reputation, 1) };
    if (o.cash < offer.cost) return { allowed: false, reason: 'money', repShort: 0 };
    return { allowed: true, reason: 'ok', repShort: 0 };
  };
  /* Amateur players cost amateur money. */
  S.tierWageMult = (t) => ({ 1: 1.25, 2: 1, 3: 0.75, 4: S.OPEN_WAGE_MULT })[t];

  S.resolveBoundary = (upper, lower, autoSeats) => ({
    relegated: upper.slice(Math.max(0, upper.length - autoSeats)),
    promoted: lower.slice(0, autoSeats),
  });

  /* ─────────────────────────── rivalries ─────────────────────────── */
  /* Memory of who a manager has played, so The Open has faces and not just a
     points column. Ported from packages/core/src/world/rivalry.ts — same
     logic, so the prototype and the engine agree on who your nemesis is. */

  S.meetingWeight = function (o) {
    let w = o.rung === 'gateway' ? 2.2 : o.rung === 'contenders' ? 1.5 : 1;
    if (o.isFinal) w *= 1.8;
    if (o.seatOnLine) w *= 1.6;
    return round(w, 2);
  };

  S.recordMeeting = function (prev, opponent, won, ctx) {
    const base = prev || { opponent: opponent, met: 0, won: 0, lost: 0, lastSeason: 0, lastWeek: 0, lastWon: false, intensity: 0 };
    return {
      opponent: opponent,
      met: base.met + 1,
      won: base.won + (won ? 1 : 0),
      lost: base.lost + (won ? 0 : 1),
      lastSeason: ctx.season,
      lastWeek: ctx.week,
      lastWon: won,
      intensity: round(base.intensity + ctx.weight, 2),
    };
  };

  S.nemesisOf = function (ledger) {
    const all = Object.keys(ledger || {}).sort().map((k) => ledger[k]).filter((h) => h && h.met > 0);
    if (!all.length) return null;
    return all.reduce((best, h) => {
      if (h.intensity !== best.intensity) return h.intensity > best.intensity ? h : best;
      if (h.met !== best.met) return h.met > best.met ? h : best;
      return h.opponent < best.opponent ? h : best;
    });
  };

  S.recordLabel = function (h) {
    if (!h || h.met === 0) return 'first meeting';
    const s = h.won + '–' + h.lost;
    if (h.won > h.lost) return s + ' up';
    if (h.won < h.lost) return s + ' down';
    return s + ' level';
  };

  S.grudgeLine = function (prev, oppName, won) {
    if (!prev || prev.met === 0) return null;
    if (won) {
      if (prev.lost > prev.won) return 'Revenge on ' + oppName + ' — they had the better of you at ' + prev.won + '–' + prev.lost + '.';
      if (!prev.lastWon) return 'You bounce back against ' + oppName + '.';
      return 'You have ' + oppName + "'s number now — that is " + (prev.won + 1) + '.';
    }
    if (prev.won > prev.lost) return oppName + ' finally get one back on you.';
    if (prev.lastWon) return oppName + ' return the favour.';
    return oppName + ' knock you out again — ' + (prev.lost + 1) + ' times now.';
  };

  S.RIVAL_CLIMBERS = { academy: 1, methodical: 1 };
  S.pickRival = function (candidates, youPrestige, rng) {
    const ordered = candidates.slice().sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
    if (!ordered.length) return null;
    const scored = ordered.map((c) => {
      const closeness = 1 - Math.min(1, Math.abs(c.prestige - youPrestige) / 30);
      const climber = S.RIVAL_CLIMBERS[c.personality] ? 1 : 0;
      const jitter = rng.float() * 0.15;
      return { id: c.id, score: closeness * 0.7 + climber * 0.2 + jitter };
    });
    scored.sort((a, b) => (a.score !== b.score ? b.score - a.score : a.id < b.id ? -1 : 1));
    return scored[0].id;
  };
})(typeof window !== 'undefined' ? window : globalThis);
