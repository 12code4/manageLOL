<title>manageLOL Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ============================ tokens ============================ */
:root{
  --bg:#0d1016; --grid:rgba(120,140,170,.04);
  --surface:#151a22; --surface-2:#1b212b; --surface-3:#222a35;
  --line:#2a3340; --line-soft:#1f2530;
  --ink:#e7eaf1; --muted:#93a0b4; --faint:#606d7e;
  --gold:#e3b24d; --gold-deep:#b98a2e; --gold-ghost:rgba(227,178,77,.12);
  --gel:#4bc08d; --toxic:#e46a5e; --info:#65a1e6; --warn:#e0a94a;
  --shadow:0 12px 30px -12px rgba(0,0,0,.6);
  --r:6px; --r-lg:10px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#e7eaf0; --grid:rgba(30,50,90,.05);
  --surface:#ffffff; --surface-2:#f1f4f9; --surface-3:#e7ecf3;
  --line:#d2d9e3; --line-soft:#e4e8ef;
  --ink:#141b28; --muted:#54607394; --muted:#556074; --faint:#8b95a6;
  --gold:#9a7413; --gold-deep:#7d5f0f; --gold-ghost:rgba(154,116,19,.10);
  --gel:#1f9160; --toxic:#c1493d; --info:#2f68c0; --warn:#b57d18;
  --shadow:0 10px 26px -14px rgba(20,30,60,.28);
  color-scheme:light;
}}
:root[data-theme="dark"]{
  --bg:#0d1016; --grid:rgba(120,140,170,.04);
  --surface:#151a22; --surface-2:#1b212b; --surface-3:#222a35;
  --line:#2a3340; --line-soft:#1f2530;
  --ink:#e7eaf1; --muted:#93a0b4; --faint:#606d7e;
  --gold:#e3b24d; --gold-deep:#b98a2e; --gold-ghost:rgba(227,178,77,.12);
  --gel:#4bc08d; --toxic:#e46a5e; --info:#65a1e6; --warn:#e0a94a;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5;
  background-image:radial-gradient(var(--grid) 1px, transparent 1px);
  background-size:22px 22px;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.cond{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
button{font-family:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:3px}
::selection{background:var(--gold-ghost)}

/* ============================ app shell ============================ */
.app{display:grid;grid-template-columns:216px 1fr;grid-template-rows:52px 1fr;height:100vh;height:100dvh}
.topbar{
  grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;
  border-bottom:1px solid var(--line);background:linear-gradient(var(--surface),var(--bg));
}
.brand{font-family:"Barlow Condensed";font-weight:700;font-size:22px;letter-spacing:.02em;line-height:1}
.brand b{color:var(--gold)}
.brand .tag{font-family:"IBM Plex Mono";font-size:9.5px;letter-spacing:.18em;color:var(--faint);
  text-transform:uppercase;display:block;margin-top:1px;font-weight:500}
.stat-strip{margin-left:auto;display:flex;gap:6px;align-items:stretch}
.stat{
  display:flex;flex-direction:column;justify-content:center;padding:4px 12px;min-width:74px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
}
.stat .k{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.stat .v{font-family:"IBM Plex Mono";font-weight:600;font-size:15px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .v.gold{color:var(--gold)}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:var(--r);background:var(--surface)}
.iconbtn:hover{border-color:var(--gold);color:var(--gold)}

/* ---- left rail ---- */
.rail{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;
  padding:12px 10px;gap:3px;overflow:auto}
.nav{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r);color:var(--muted);
  border:1px solid transparent;background:none;width:100%;text-align:left;font-size:13.5px;font-weight:500}
.nav svg{width:17px;height:17px;flex:none;stroke-width:1.7}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav.active{background:var(--gold-ghost);color:var(--gold);border-color:color-mix(in srgb,var(--gold) 30%,transparent)}
.nav .badge{margin-left:auto;font-family:"IBM Plex Mono";font-size:10px;padding:1px 6px;border-radius:20px;
  background:var(--surface-3);color:var(--muted)}
.nav.active .badge{background:var(--gold);color:#1a1206}
.rail-sep{height:1px;background:var(--line-soft);margin:10px 4px}
.rail-title{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);padding:2px 11px 6px}

/* ---- pyramid mini ---- */
.pyr{display:flex;flex-direction:column-reverse;gap:3px;padding:0 8px}
.pyr .step{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;font-size:12px;
  color:var(--faint);border:1px solid transparent;position:relative}
.pyr .dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.pyr .step.done{color:var(--muted)}
.pyr .step.done .dot{background:var(--gel)}
.pyr .step.cur{color:var(--gold);background:var(--gold-ghost);border-color:color-mix(in srgb,var(--gold) 25%,transparent)}
.pyr .step.cur .dot{background:var(--gold);box-shadow:0 0 0 3px var(--gold-ghost)}

/* ---- main ---- */
.main{overflow:auto;padding:20px 24px 40px}
.screen-head{margin-bottom:16px}
.eyebrow{font-family:"IBM Plex Mono";font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 4px}
h1.title{font-family:"Barlow Condensed";font-weight:700;font-size:30px;letter-spacing:.01em;margin:0;line-height:1}
.sub{color:var(--muted);font-size:13px;margin:5px 0 0;max-width:70ch}

/* ============================ generic bits ============================ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:13px}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--gold);color:#1a1206;border-color:var(--gold)}
.btn.primary:hover{filter:brightness(1.06);color:#1a1206}
.btn.ghost{background:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono";font-size:10.5px;
  padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--gel);border-color:color-mix(in srgb,var(--gel) 40%,transparent);background:color-mix(in srgb,var(--gel) 10%,transparent)}
.pill.bad{color:var(--toxic);border-color:color-mix(in srgb,var(--toxic) 40%,transparent);background:color-mix(in srgb,var(--toxic) 10%,transparent)}
.pill.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 40%,transparent);background:color-mix(in srgb,var(--info) 10%,transparent)}
.pill.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent);background:var(--gold-ghost)}
.role-tag{font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* tier gem badge */
.gem{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono";font-size:11px;font-weight:600}
.gem i{width:11px;height:11px;transform:rotate(45deg);border-radius:2px;display:inline-block;
  box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}

/* ============================ scout screen ============================ */
.scout-grid{display:grid;grid-template-columns:1fr 372px;gap:18px;align-items:start}
@media(max-width:1080px){.scout-grid{grid-template-columns:1fr}}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
select,input[type=text]{font-family:inherit;font-size:12.5px;background:var(--surface-2);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--r);padding:6px 9px}
.ladder{width:100%;border-collapse:collapse}
.ladder thead th{font-family:"IBM Plex Mono";font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);text-align:left;padding:0 10px 8px;font-weight:500;position:sticky;top:0;background:var(--bg)}
.ladder td{padding:9px 10px;border-top:1px solid var(--line-soft)}
.ladder tbody tr{cursor:pointer}
.ladder tbody tr:hover{background:var(--surface)}
.ladder tbody tr.sel{background:var(--gold-ghost);box-shadow:inset 2px 0 0 var(--gold)}
.ladder tbody tr.signed{opacity:.42}
.handle{font-family:"Barlow Condensed";font-weight:600;font-size:16.5px;letter-spacing:.01em}
.wr{font-family:"IBM Plex Mono";font-size:12px;color:var(--muted)}
.flagline{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}

/* detail panel */
.detail{position:sticky;top:0}
.detail .dh{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.detail .db{padding:14px 16px}
.detail .empty{padding:40px 20px;text-align:center;color:var(--faint);font-size:13px}
.fog-row{margin:0 0 9px}
.fog-row .lab{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
.fog-row .lab .nm{color:var(--muted)}
.fog-row .lab .rd{font-family:"IBM Plex Mono";font-size:11px;color:var(--ink)}
.track{position:relative;height:8px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.band{position:absolute;top:0;bottom:0;border-radius:5px;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--gold) 55%,transparent),transparent);
  transition:left .5s cubic-bezier(.4,0,.2,1),right .5s cubic-bezier(.4,0,.2,1)}
.band.exact{background:var(--gold)}
.mark{position:absolute;top:-2px;width:2px;height:12px;background:var(--ink);border-radius:2px}
.scoutbar{display:flex;align-items:center;gap:8px;margin:6px 0 14px}
.confbar{flex:1;height:5px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.confbar i{display:block;height:100%;background:var(--info);width:0;transition:width .4s}

/* ============================ squad screen ============================ */
.squad-grid{display:grid;grid-template-columns:1fr 440px;gap:18px;align-items:start}
@media(max-width:1080px){.squad-grid{grid-template-columns:1fr}}
.slot-row{display:flex;flex-direction:column;gap:8px}
.pcard{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px}
.pcard .rl{font-family:"Barlow Condensed";font-weight:700;font-size:12px;color:var(--gold);text-align:center;
  border-right:1px solid var(--line-soft);padding-right:10px;letter-spacing:.05em;text-transform:uppercase}
.pcard .nm{font-family:"Barlow Condensed";font-weight:600;font-size:19px;line-height:1}
.pcard .meta{font-size:11px;color:var(--muted);margin-top:2px}
.ov{font-family:"Barlow Condensed";font-weight:700;font-size:26px;line-height:1;text-align:center}
.ov small{display:block;font-family:"IBM Plex Mono";font-size:8.5px;letter-spacing:.12em;color:var(--faint);font-weight:500}
.mini-bars{display:flex;gap:9px;margin-top:7px;flex-wrap:wrap}
.mb{font-size:10px;color:var(--muted)}
.mb b{font-family:"IBM Plex Mono";color:var(--ink);font-weight:600}
.state-chips{display:flex;gap:5px;margin-top:6px}
.chip{font-family:"IBM Plex Mono";font-size:9.5px;padding:1px 6px;border-radius:4px;background:var(--surface-3);color:var(--muted)}
.slot-empty{display:flex;align-items:center;justify-content:space-between;padding:14px;border:1px dashed var(--line);
  border-radius:var(--r-lg);color:var(--faint);background:repeating-linear-gradient(135deg,transparent,transparent 8px,var(--line-soft) 8px,var(--line-soft) 9px)}

/* chemistry web */
.web-wrap{padding:16px 16px 8px;text-align:center}
.coh-label{font-family:"Barlow Condensed";font-weight:700;font-size:26px;line-height:1;margin-top:4px}
.analyst{font-size:12.5px;color:var(--muted);padding:12px 16px;border-top:1px solid var(--line-soft);line-height:1.55}
.analyst b{color:var(--ink);font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:8px 16px 14px;font-size:10px;color:var(--faint)}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}

/* ============================ compete screen ============================ */
.vs{display:grid;grid-template-columns:1fr 60px 1fr;gap:14px;align-items:center;margin-bottom:16px}
.teamcard{padding:16px}
.teamcard.you{border-color:color-mix(in srgb,var(--gold) 35%,var(--line))}
.teamcard .tn{font-family:"Barlow Condensed";font-weight:700;font-size:22px;line-height:1}
.teamcard .ts{font-family:"Barlow Condensed";font-weight:700;font-size:40px;line-height:1;margin-top:6px}
.teamcard .ts small{font-family:"IBM Plex Mono";font-size:9px;letter-spacing:.12em;color:var(--faint);font-weight:500;display:block}
.vs .mid{text-align:center;font-family:"Barlow Condensed";font-weight:700;color:var(--faint);font-size:18px}
.wpbar{height:26px;border-radius:6px;overflow:hidden;display:flex;border:1px solid var(--line);margin-bottom:16px;font-family:"IBM Plex Mono";font-size:11px;font-weight:600}
.wpbar .you{background:var(--gold-ghost);color:var(--gold);display:flex;align-items:center;padding:0 10px}
.wpbar .opp{background:var(--surface-2);color:var(--muted);display:flex;align-items:center;justify-content:flex-end;padding:0 10px;margin-left:auto}
.games{display:flex;gap:8px;margin-bottom:14px}
.gpip{flex:1;padding:8px;border-radius:6px;border:1px solid var(--line);text-align:center;font-size:11px;color:var(--muted);background:var(--surface)}
.gpip.win{border-color:var(--gel);color:var(--gel)}
.gpip.loss{border-color:var(--toxic);color:var(--toxic)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{padding:8px 0 8px 18px;border-left:2px solid var(--line);position:relative;font-size:12.5px;color:var(--muted);
  opacity:0;transform:translateX(-4px);animation:reveal .35s forwards}
.timeline li:before{content:"";position:absolute;left:-5px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
@keyframes reveal{to{opacity:1;transform:none}}
.statline{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
.statline th{font-family:"IBM Plex Mono";font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:right;padding:4px 8px;font-weight:500}
.statline th:first-child{text-align:left}
.statline td{padding:5px 8px;border-top:1px solid var(--line-soft);text-align:right;font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums}
.statline td:first-child{text-align:left;font-family:"IBM Plex Sans"}
.mvp{color:var(--gold)}

/* ============================ sponsors ============================ */
.sponsor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.sponsor{padding:16px;display:flex;flex-direction:column;gap:8px}
.sponsor .snm{font-family:"Barlow Condensed";font-weight:700;font-size:20px;line-height:1}
.sponsor .flav{font-size:11.5px;color:var(--muted);min-height:32px}
.terms{display:flex;flex-direction:column;gap:5px;font-size:12px;margin:2px 0}
.terms .t{display:flex;justify-content:space-between;color:var(--muted)}
.terms .t b{font-family:"IBM Plex Mono";color:var(--ink);font-weight:600}

/* ============================ draft board ============================ */
.draft{display:grid;grid-template-columns:232px 1fr 300px;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--bg)}
.dhead{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);grid-column:1/4}
.phase-chips{display:flex;gap:6px}
.pchip{font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.1em;padding:3px 9px;border-radius:4px;color:var(--faint);border:1px solid var(--line-soft)}
.pchip.on{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent);background:var(--gold-ghost)}
.dtimer{font-family:"IBM Plex Mono";font-weight:600;font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.dcol{padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface);min-height:560px}
.dcol.you{border-right:1px solid var(--line)} .dcol.them{border-left:1px solid var(--line)}
.dcenter{padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.slot{height:34px;border-radius:5px;border:1px dashed var(--line);display:flex;align-items:center;padding:0 10px;font-family:"Barlow Condensed";font-weight:600;font-size:14px;gap:8px;color:var(--ink)}
.slot.filled{border-style:solid;background:var(--surface-2)}
.slot.ban{text-decoration:line-through;color:var(--muted)}
.slot.now{border-color:var(--gold);background:var(--gold-ghost);color:var(--gold);font-family:"IBM Plex Mono";font-size:10px;font-weight:500;letter-spacing:.1em}
.slot .pf{margin-left:auto;font-family:"IBM Plex Mono";font-size:10px;font-weight:500}
.slot .rt{font-family:"IBM Plex Mono";font-size:9px;color:var(--faint);letter-spacing:.06em}
.bans-row{display:flex;gap:5px} .bans-row .slot{flex:1;height:28px;padding:0 4px;justify-content:center;font-size:11px}
.champ-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:7px;max-height:340px;overflow:auto;padding-right:2px}
.ccard{border-radius:6px;background:var(--surface-2);border:1px solid var(--line);padding:8px 9px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;font-family:inherit;color:inherit}
.ccard:hover{border-color:var(--gold)} .ccard.taken{opacity:.28;cursor:default} .ccard.taken:hover{border-color:var(--line)}
.ccard.top{border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.ccard .cn{display:flex;justify-content:space-between;align-items:baseline;font-family:"Barlow Condensed";font-weight:600;font-size:14.5px;gap:6px}
.ccard .ep{font-size:9px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tierchip{font-family:"IBM Plex Mono";font-size:9px;font-weight:600;flex:none}
.tier-S{color:var(--gold)} .tier-A{color:var(--ink)} .tier-B{color:var(--muted)} .tier-C{color:var(--faint)}
.curve{display:flex;gap:2px;align-items:flex-end;height:12px}
.curve i{display:block;width:9px;border-radius:1px;background:var(--line)} .curve i.hi{background:var(--gold)}
.ccard .pilot{font-family:"IBM Plex Mono";font-size:9px;color:var(--gel)} .ccard .pilot.warn{color:var(--toxic)} .ccard .pilot.off{color:var(--warn)} .ccard .pilot.dim{color:var(--faint)}
.coachbox{border-radius:6px;background:var(--surface);border:1px solid var(--line);padding:10px 12px}
.coachbox .row{display:flex;gap:10px;font-size:12.5px;padding:4px 0;cursor:pointer;border-radius:4px} .coachbox .row:hover{background:var(--surface-2)}
.coachbox .row .v{margin-left:auto;font-family:"IBM Plex Mono";color:var(--gel)}
.compread{border-radius:6px;background:var(--surface-2);border:1px solid var(--line);padding:10px 12px;margin-top:auto}
.compread .lbl{font-family:"Barlow Condensed";font-weight:700;font-size:18px;color:var(--gold);line-height:1.1}
.compread .lbl.them{color:var(--info)}
.clarity{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:6px}
.clarity i{display:block;height:100%;background:var(--gold)} .clarity i.them{background:var(--info)}
.crowd{display:flex;flex-direction:column;min-height:0;flex:1}
.crowd .ch{display:flex;align-items:center;margin-bottom:6px;gap:8px}
.crowd .list{display:flex;flex-direction:column;gap:6px;font-size:11.5px;line-height:1.45;overflow:hidden;flex:1;justify-content:flex-end}
.crowd .u{font-family:"IBM Plex Mono";font-size:10.5px} .crowd .t{color:var(--muted)}
.crowd .m{opacity:0;animation:reveal .3s forwards}
.hype{width:42px;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.hype i{display:block;height:100%;background:var(--toxic)}
.dfoot{grid-column:1/4;display:flex;gap:16px;align-items:center;padding:8px 16px;border-top:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--muted);min-height:36px;flex-wrap:wrap}
.verdict{border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);padding:16px 18px;margin-top:14px}
.verdict .big{font-family:"Barlow Condensed";font-weight:700;font-size:28px;line-height:1}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}

<script>
/* manageLOL — self-contained sim (faithful JS port of @managelol/core).
   Same algorithms as packages/core; kept dependency-free for the prototype. */
(function (root) {
  'use strict';

  // ---------- RNG (xmur3 + mulberry32) ----------
  function xmur3(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function () {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      h ^= h >>> 16;
      return h >>> 0;
    };
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function Rng(seed, stream) {
    const s = xmur3(seed + '::' + stream);
    this.next = mulberry32(s());
    this._spare = null;
  }
  Rng.prototype.float = function () { return this.next(); };
  Rng.prototype.range = function (lo, hi) { return lo + (hi - lo) * this.next(); };
  Rng.prototype.int = function (lo, hi) { return Math.floor(this.range(lo, hi + 1)); };
  Rng.prototype.chance = function (p) { return this.next() < Math.max(0, Math.min(1, p)); };
  Rng.prototype.pick = function (arr) { return arr[Math.floor(this.next() * arr.length)]; };
  Rng.prototype.normal = function () {
    if (this._spare !== null) { const s = this._spare; this._spare = null; return s; }
    const u1 = 1 - this.next(), u2 = this.next();
    const mag = Math.sqrt(-2 * Math.log(u1));
    this._spare = mag * Math.sin(2 * Math.PI * u2);
    return mag * Math.cos(2 * Math.PI * u2);
  };
  Rng.prototype.gaussian = function (m, sd, lo, hi) {
    let v = m + sd * this.normal();
    if (lo !== undefined) v = Math.max(lo, v);
    if (hi !== undefined) v = Math.min(hi, v);
    return v;
  };

  const clamp = (x, lo, hi) => (x < lo ? lo : x > hi ? hi : x);
  const c100 = (x) => clamp(x, 0, 100);
  const mean = (xs) => xs.reduce((s, x) => s + x, 0) / xs.length;
  const round = (x, dp) => { const f = Math.pow(10, dp || 0); return Math.round(x * f) / f; };
  function winProb(diff, scale) { return 1 / (1 + Math.pow(10, -diff / (scale || 120))); }

  // ---------- content: roles / archetypes / regions ----------
  const ROLES = ['top', 'jungle', 'mid', 'bot', 'support'];
  const ARCHES = ['tankEngage', 'skirmisher', 'assassin', 'scalingCarry', 'laneBully', 'controlMage', 'poke', 'enchanter', 'catcher', 'splitPush', 'earlyJungle'];
  const ROLE_ARCH = {
    top: ['tankEngage', 'skirmisher', 'splitPush', 'controlMage'],
    jungle: ['earlyJungle', 'skirmisher', 'assassin', 'tankEngage', 'catcher'],
    mid: ['assassin', 'controlMage', 'scalingCarry', 'poke', 'laneBully'],
    bot: ['scalingCarry', 'laneBully', 'poke'],
    support: ['enchanter', 'catcher', 'tankEngage'],
  };
  const REGIONS = {
    kyo: { name: 'Kyorin', wealth: 1.05, langs: ['kyoril', 'common'], bias: { mechanics: 8, reflexes: 7, laning: 6, waveManagement: 5, consistency: 4, professionalism: 6, workEthic: 6, streamAppeal: -3 }, on: ['Se', 'Ky', 'Ji', 'Ha', 'Do', 'Mu', 'Ry', 'Ta', 'Wo', 'Bi', 'Gu', 'Sh'], nu: ['a', 'eo', 'u', 'i', 'o', 'ae', 'ya'], co: ['n', 'k', 'ng', 'l', 'm', 'ru', 'ho', ''] },
    tia: { name: 'Tianxu', wealth: 1.5, langs: ['tianhua', 'common'], bias: { teamfighting: 7, playstyleAggression: 10, mechanics: 5, objectiveControl: 5, ego: 5, ambition: 6, mapAwareness: -2 }, on: ['Xi', 'Zh', 'Ru', 'Ka', 'Ll', 'Sh', 'Ti', 'Ya', 'Fo', 'We', 'Ji', 'Ma'], nu: ['a', 'ao', 'e', 'ai', 'ou', 'u', 'ei'], co: ['n', 'ng', 'o', 'i', 'x', 'ge', 'ke', ''] },
    mer: { name: 'Meridia', wealth: 1.1, langs: ['meric', 'auran', 'common'], bias: { rotations: 7, shotcalling: 6, adaptability: 6, visionControl: 5, leadership: 5, communication: 6, mediaHandling: 4, mechanics: -3 }, on: ['Ca', 'Vi', 'Lu', 'Ma', 'Re', 'Th', 'Ni', 'Ga', 'Br', 'El', 'Or', 'Fe'], nu: ['a', 'e', 'i', 'o', 'au', 'ie', 'ea'], co: ['s', 'x', 'n', 'r', 'z', 'll', 'ne', ''] },
    van: { name: 'Vantia', wealth: 1.55, langs: ['vanto', 'common'], bias: { starPower: 8, streamAppeal: 10, marketability: 8, fanbase: 6, ego: 4, mechanics: -2, professionalism: -3, consistency: -3 }, on: ['Ja', 'Ma', 'Da', 'Ko', 'Ze', 'Ni', 'Bl', 'Tr', 'Sn', 'Vi', 'Ra', 'Cl'], nu: ['a', 'e', 'i', 'o', 'u', 'ay', 'oo'], co: ['x', 'z', 'n', 'r', 'sh', 'ke', 'per', ''] },
    wilds: { name: 'the Wilds', wealth: 0.5, langs: ['common'], bias: { potential: 4, playstyleRiskTaking: 8, consistency: -6, professionalism: -4, mechanics: 2 }, on: ['Ak', 'Zu', 'Ne', 'Ov', 'Ka', 'Ri', 'Ta', 'Yo', 'Mi', 'Du', 'Fa', 'Pe'], nu: ['a', 'e', 'i', 'o', 'u', 'ia', 'ou'], co: ['n', 'k', 's', 'r', 'm', 'to', 'vi', ''] },
  };
  function handle(rng, reg) {
    const syl = () => rng.pick(reg.on) + rng.pick(reg.nu) + rng.pick(reg.co);
    let h = syl();
    if (rng.chance(0.35)) h += rng.pick(reg.nu) + rng.pick(reg.co);
    h = h.charAt(0).toUpperCase() + h.slice(1).toLowerCase();
    return h.slice(0, 10);
  }

  // ---------- player generation ----------
  function genPlayer(rng, opts) {
    const reg = REGIONS[opts.region];
    const bias = reg.bias, c = opts.qualityCenter, sd = opts.spread || 8;
    const b = (k) => c100(rng.gaussian(c + (bias[k] || 0), sd));
    const ar = opts.ageRange || [16, 27];
    const age = rng.int(ar[0], ar[1]);
    const primaryRole = opts.primaryRole || rng.pick(ROLES);
    const roleApt = {};
    ROLES.forEach((r) => { if (r !== primaryRole) roleApt[r] = c100(rng.gaussian(c - 18, 12)); });
    const bestOff = Math.max.apply(null, ROLES.filter((r) => r !== primaryRole).map((r) => roleApt[r]));
    roleApt[primaryRole] = c100(Math.max(rng.gaussian(c + 12, 6), bestOff + rng.range(2, 8)));
    const secondaryRole = ROLES.filter((r) => r !== primaryRole).sort((x, y) => roleApt[y] - roleApt[x])[0];
    const preferredArchetype = rng.pick(ROLE_ARCH[primaryRole]);
    const champ = {};
    ARCHES.forEach((a) => { let v = rng.gaussian(c - 8, 10); if (ROLE_ARCH[primaryRole].indexOf(a) >= 0) v += 12; if (a === preferredArchetype) v += 10; champ[a] = c100(v); });
    const peakAge = rng.int(20, 24), declineStartAge = peakAge + rng.int(1, 4);
    const yearsToPeak = Math.max(0, peakAge - age);
    const gapMean = yearsToPeak * 2.2 + (bias.potential || 0);
    const reflexYouth = c100((peakAge - age) * 1.3);
    const A = {
      mechanical: { mechanics: b('mechanics'), laning: b('laning'), teamfighting: b('teamfighting'), reflexes: c100(c100(rng.gaussian(c + (bias.reflexes || 0), sd)) + reflexYouth - 4), positioning: b('positioning') },
      gameKnowledge: { mapAwareness: b('mapAwareness'), waveManagement: b('waveManagement'), objectiveControl: b('objectiveControl'), visionControl: b('visionControl'), rotations: b('rotations'), adaptability: b('adaptability'), shotcalling: b('shotcalling') },
      mental: { composure: b('composure'), consistency: b('consistency'), focus: b('focus'), clutch: c100(rng.gaussian(50, 18)), tiltResistance: c100(rng.gaussian(52, 16)) },
      roleAptitude: { primaryRole: primaryRole, secondaryRole: secondaryRole, top: roleApt.top, jungle: roleApt.jungle, mid: roleApt.mid, bot: roleApt.bot, support: roleApt.support, roleFlexibility: c100(rng.gaussian(45, 18)) },
      championAptitude: champ,
      growth: { potential: 0, growthRate: c100(rng.gaussian(60, 15)), peakAge: peakAge, declineStartAge: declineStartAge, declineRate: c100(rng.gaussian(50, 15)), mechanicalDeclineBias: Math.max(0.3, rng.gaussian(1.1, 0.35)), learningRate: c100(rng.gaussian(58, 15)), workEthic: b('workEthic'), burnoutProneness: c100(rng.gaussian(45, 18)) },
      personality: { ambition: b('ambition'), loyalty: c100(rng.gaussian(50, 20)), professionalism: b('professionalism') },
      chemistry: { communication: b('communication'), leadership: c100(rng.gaussian(45, 18)), ego: c100(rng.gaussian(45, 18) + (bias.ego || 0)), temperament: c100(rng.gaussian(50, 20)), coachability: c100(rng.gaussian(55, 18)), introversion: c100(rng.gaussian(52, 20)), mentorship: c100(rng.gaussian(40, 18) + Math.max(0, age - 22) * 2), teamplayOrientation: c100(rng.gaussian(52, 18)), playstyleAggression: b('playstyleAggression'), playstyleTempo: c100(rng.gaussian(50, 20)), playstyleRiskTaking: b('playstyleRiskTaking'), preferredArchetype: preferredArchetype },
      brand: { starPower: c100(rng.gaussian(30, 15) + (bias.starPower || 0)), streamAppeal: b('streamAppeal'), fanbase: c100(rng.gaussian(25, 15) + (bias.fanbase || 0)), marketability: b('marketability'), mediaHandling: b('mediaHandling') },
    };
    const ca = currentAbility(A);
    A.growth.potential = c100(Math.max(ca + 1, ca + rng.gaussian(gapMean, 6)));
    const langs = [reg.langs[0]];
    if (reg.langs[0] !== 'common' && rng.chance(0.7)) langs.push('common');
    return {
      id: opts.id, name: handle(rng, reg), age: age, region: opts.region,
      nationality: opts.region, languageIds: langs, attributes: A,
      state: { form: Math.round(rng.gaussian(50, 8)), fatigue: Math.round(c100(rng.gaussian(15, 10))), morale: Math.round(c100(rng.gaussian(58, 12))), sharpness: Math.round(c100(rng.gaussian(70, 15))) },
    };
  }

  // ---------- ratings ----------
  function currentAbility(A) {
    const m = A.mechanical, k = A.gameKnowledge, mn = A.mental;
    const mechAvg = mean([m.mechanics, m.laning, m.teamfighting, m.reflexes, m.positioning]);
    const knowAvg = mean([k.mapAwareness, k.waveManagement, k.objectiveControl, k.visionControl, k.rotations, k.adaptability, k.shotcalling]);
    const menAvg = mean([mn.composure, mn.consistency, mn.focus, mn.clutch, mn.tiltResistance]);
    return 0.34 * mechAvg + 0.34 * knowAvg + 0.22 * menAvg + 0.10 * m.teamfighting;
  }
  const formMult = (s) => 1 + (s.form - 50) / 250;
  const fatigueMult = (s) => 1 - (s.fatigue / 100) * 0.25;
  const sharpMult = (s) => 0.9 + 0.1 * (s.sharpness / 100);
  const stateMult = (s) => formMult(s) * fatigueMult(s) * sharpMult(s);
  const roleMult = (A, r) => 0.4 + 0.6 * (A.roleAptitude[r] / 100);
  const discomfort = (A, r) => (r === A.roleAptitude.primaryRole ? 1 : 0.85 + 0.15 * (A.roleAptitude.roleFlexibility / 100));
  const effRoleMult = (A, r) => roleMult(A, r) * discomfort(A, r);
  const ROLE_W = {
    top: { laning: 0.35, mechanics: 0.2, waveManagement: 0.15, teamfighting: 0.15, mapAwareness: 0.15 },
    jungle: { mapAwareness: 0.3, objectiveControl: 0.25, mechanics: 0.2, teamfighting: 0.15, waveManagement: 0.1 },
    mid: { laning: 0.35, mechanics: 0.25, waveManagement: 0.15, mapAwareness: 0.15, teamfighting: 0.1 },
    bot: { laning: 0.3, mechanics: 0.25, teamfighting: 0.25, positioning: 0.15, waveManagement: 0.05 },
    support: { visionControl: 0.25, mapAwareness: 0.2, teamfighting: 0.2, objectiveControl: 0.15, positioning: 0.1, mechanics: 0.1 },
  };
  function roleCore(A, r) {
    const w = ROLE_W[r]; let sum = 0;
    for (const k in w) { const v = A.mechanical[k] !== undefined ? A.mechanical[k] : A.gameKnowledge[k] || 0; sum += v * w[k]; }
    return sum;
  }
  const effRoleStrength = (A, s, r) => roleCore(A, r) * effRoleMult(A, r) * stateMult(s);

  // ---------- ladder ----------
  const TIERS = [
    { key: 'slate', name: 'Slate', floor: 500 }, { key: 'copper', name: 'Copper', floor: 900 },
    { key: 'quartz', name: 'Quartz', floor: 1200 }, { key: 'amber', name: 'Amber', floor: 1500 },
    { key: 'jade', name: 'Jade', floor: 1800 }, { key: 'cobalt', name: 'Cobalt', floor: 2050 },
    { key: 'onyx', name: 'Onyx', floor: 2300 }, { key: 'ascendant', name: 'Ascendant', floor: 2600 },
    { key: 'paragon', name: 'Paragon', floor: 2850 }, { key: 'apex', name: 'Apex', floor: 3050 },
  ];
  function tierFromMmr(m) { let o = TIERS[0]; for (const t of TIERS) if (m >= t.floor) o = t; return o; }
  function divFromMmr(m) { const t = tierFromMmr(m), i = TIERS.indexOf(t), n = TIERS[i + 1]; if (!n) return 1; const w = (n.floor - t.floor) / 4; return 4 - Math.min(3, Math.floor((m - t.floor) / w)); }
  function soloAbility(A) {
    const m = A.mechanical, k = A.gameKnowledge;
    return c100(0.26 * m.mechanics + 0.16 * m.laning + 0.14 * m.teamfighting + 0.12 * k.mapAwareness + 0.10 * m.reflexes + 0.08 * m.positioning + 0.08 * k.waveManagement + 0.06 * A.mental.composure);
  }
  const SOLO_APTS = ['assassin', 'laneBully', 'skirmisher', 'scalingCarry', 'earlyJungle', 'catcher'];
  const maxSoloApt = (A) => Math.max.apply(null, SOLO_APTS.map((x) => A.championAptitude[x]));
  function computeMmr(i) {
    const RANGE = 2900, base = 500 + RANGE * Math.pow(i.soloAbility / 100, 1.6);
    const bMeta = RANGE * 0.1 * ((i.maxSoloApt - 50) / 50);
    const bMental = RANGE * 0.04 * (((i.composure - 50) / 50) + ((i.tiltResistance - 50) / 50)) / 2;
    const bRole = i.autofill ? -RANGE * 0.05 : 0;
    const steady = clamp(base + bMeta + bMental + bRole + i.boost, 500, 3400);
    const placement = 1200 + 0.15 * steady;
    const conv = 1 - Math.exp(-i.games / 120);
    const cur = clamp(placement + (steady - placement) * conv, 500, 3400);
    return { base: base, steady: steady, current: cur, tier: tierFromMmr(cur).key };
  }
  function genLadderEntity(rng, opts) {
    const plant = opts.plant || null;
    let qc = 55, ar = [16, 24];
    if (plant === 'hiddenGem' || plant === 'smurf') { qc = 72; ar = [16, 19]; }
    if (plant === 'boosted' || plant === 'bust') { qc = 58; ar = [20, 25]; }

const el = (tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const fmt = (n)=> (Math.round(n)).toLocaleString();
const ROLE_ORDER=['top','jungle','mid','bot','support'];
const ROLE_LABEL={top:'Top',jungle:'Jungle',mid:'Mid',bot:'Bot',support:'Support'};
const ARCH_LABEL={tankEngage:'Tank / Engage',skirmisher:'Skirmisher',assassin:'Assassin',scalingCarry:'Scaling Carry',laneBully:'Lane Bully',controlMage:'Control Mage',poke:'Poke',enchanter:'Enchanter',catcher:'Catcher',splitPush:'Split Push',earlyJungle:'Early Jungle'};
const REGION_NAME={kyo:'Kyorin',tia:'Tianxu',mer:'Meridia',van:'Vantia',wilds:'the Wilds'};
const TIER_HUE={slate:'#7b8794',copper:'#c1824a',quartz:'#c3ccd6',amber:'#e0a93f',jade:'#46b98a',cobalt:'#4f83d6',onyx:'#8a6fd0',ascendant:'#d15b8f',paragon:'#e0803a',apex:'#f0d45e'};

  boosted:{label:'BOOSTED',cls:'bad',tip:'Rank propped up by a duo; will fall'},
  bust:{label:'BUST',cls:'bad',tip:'Looks pro-ready, but no growth left'},
};
const STAGES=[
  {key:'local',name:'Local Opens',oppCenter:46,wins:3,prize:7,rep:5,fee:1.0,blurb:'Amateur weekend brackets. Field a five, win three, and earn a Regional invite.'},
  {key:'regional',name:'Regional Circuit',oppCenter:55,wins:3,prize:12,rep:7,fee:1.25,blurb:'Regional qualifiers. Beat established amateur orgs to reach the Second Division.'},
  {key:'second',name:'Second Division',oppCenter:63,wins:4,prize:18,rep:9,fee:1.6,blurb:'Semi-pro league play. Top the table to enter the Promotion Gauntlet.'},
  {key:'league',name:'The Prime League',oppCenter:71,wins:4,prize:30,rep:13,fee:2.2,blurb:'The top league — revenue share and real stakes. Win the split to qualify for Worlds.'},
  {key:'worlds',name:'Worlds',oppCenter:81,wins:5,prize:70,rep:24,fee:3.0,blurb:'The mountaintop. Cross-region knockouts against the best teams alive.'},
];
const SPONSOR_TEMPLATES=[
  {nm:'Brambley Café',flav:'A local coffee chain that just wants its logo on your jerseys.',tier:0,base:2,weekly:0.6,clause:null,ob:'Low-key'},
  {nm:'Kessel Peripherals',flav:'Mid-tier keyboards and mice. Reliable, unglamorous money.',tier:1,base:4,weekly:1.1,clause:'+3 if you reach playoffs',ob:'1 content day / month'},
  {nm:'Voltcurrent Energy',flav:'Loud energy-drink brand chasing a young audience. Pays well, demands airtime.',tier:2,base:7,weekly:2.0,clause:'+6 on a title',ob:'2 content days / month (−fatigue)'},
  {nm:'Meridian Telecom',flav:'A regional carrier that backs winners and expects results.',tier:2,base:9,weekly:2.6,clause:'−4 if you miss playoffs',ob:'Media obligations'},
  {nm:'Nyx Exchange',flav:'A crypto exchange with more money than sense. Huge upside, reputational risk.',tier:3,base:16,weekly:4.2,clause:'volatile — may pull out',ob:'Heavy branding'},
  {nm:'Aurora Apparel',flav:'Premium apparel label. Only signs teams with real brand pull.',tier:3,base:13,weekly:3.6,clause:'+10 at Worlds',ob:'Photoshoots'},
];

let G=null, seedCtr=0;

function pushLog(text,kind){G.inbox.unshift({week:G.week,text:text,kind:kind||'info'});if(G.inbox.length>60)G.inbox.pop();}
function toast(text,kind){
  const box=$('#toasts');
  while(box.children.length>=4)box.firstChild.remove(); // never let toasts pile up
  const t=el('div','toast'+(kind?' '+kind:''),text);box.appendChild(t);
  setTimeout(()=>{t.style.transition='opacity .4s,transform .4s';t.style.opacity='0';t.style.transform='translateY(6px)';setTimeout(()=>t.remove(),400);},3400);
}

function newGame(seed){
  seed = seed || ('career-'+(Date.now?.()||seedCtr++)+'-'+Math.floor((typeof performance!=='undefined'?performance.now():seedCtr)*7%9973));
  const rng=new S.Rng(seed,'world');
  const ladder=[];
  // a home-region ladder pool: mostly ordinary, a controlled sprinkle of archetypes
  const plants=[null,null,null,null,null,null,'hiddenGem',null,null,'boosted',null,'smurf',null,null,'bust',null,'hiddenGem',null,null,'boosted'];
  const regions=['mer','mer','mer','kyo','tia','van','wilds'];
  for(let i=0;i<46;i++){
    const region=rng.pick(regions);
    const e=S.genLadderEntity(new S.Rng(seed,'lad:'+i),{id:'lad'+i,region:region,plant:plants[i%plants.length]});
    e.scout={conf:0,status:'spotted',revealed:[]};
    ladder.push(e);
  }
  ladder.sort((a,b)=>b.mmr-a.mmr);
  G={
    seed:seed, week:1, cash:60, reputation:8, scoutPts:6, scoutBudget:6,
    stageIndex:0, stageWins:0,
    ladder:ladder, roster:{top:null,jungle:null,mid:null,bot:null,support:null}, chem:null,
    sponsors:{active:[],offers:[]}, inbox:[], ui:{screen:'scout',selLad:ladder[0]?.id||null,match:null},
    orgName:'Your Org', matchOpp:null, patch:null, patchFamiliarity:60, coachQuality:45, match:null,
  };
  G.patch=S.genPatch(new S.Rng(seed,'meta:0'),0);
  refreshSponsorOffers();
  pushLog('Career started. You take over a broke amateur org — fill five seats and earn a Regional invite.','info');
  render();
}

function stage(){return STAGES[G.stageIndex];}
function rosterCount(){return ROLE_ORDER.filter(r=>G.roster[r]).length;}
function lineup(){const l={};ROLE_ORDER.forEach(r=>{if(G.roster[r])l[r]=G.roster[r];});return l;}
function recomputeChem(){G.chem=S.reconcileChem(G.chem,lineup());}

function scoutedRange(tv,conf){const half=22*(1-conf);return [Math.max(0,tv-half),Math.min(100,tv+half)];}
function potentialRead(pot,conf){
  const tiers=[['limited',0],['solid',55],['high',68],['elite',80],['generational',90]];
  let label='limited';for(const[l,f]of tiers)if(pot>=f)label=l;
  const cl=conf>=.85?'certain':conf>=.6?'confident':conf>=.3?'a read':'a hunch';
  if(conf<0.35)return {label:'?',conf:cl};
  return {label:label,conf:cl};
}
function overall(p){return Math.round(S.currentAbility(p.attributes));}
function signingFee(e){
  const base=S.clamp((e.mmr-1000)/140+1,1,45);
  const pot=e.hidden.potential;
  const mult=1+0.8*e.scout.conf*S.clamp((pot-55)/45,0,1);
  return Math.max(1,Math.round(base*mult*stage().fee));
}

function refreshSponsorOffers(){
  const rng=new S.Rng(G.seed,'spon:'+G.week);
  const pull=G.reputation/100 + rosterBrand()/200; // 0..~1
  const pool=SPONSOR_TEMPLATES.filter(t=>t.tier<= (pull>0.5?3:pull>0.28?2:pull>0.12?1:0));
  const offers=[];const used={};
  for(let i=0;i<Math.min(3,pool.length);i++){
    let pick;let guard=0;do{pick=rng.pick(pool);guard++;}while(used[pick.nm]&&guard<12);used[pick.nm]=1;
    offers.push(Object.assign({id:'spo'+G.week+'_'+i},pick));
  }
  G.sponsors.offers=offers.filter(o=>!G.sponsors.active.some(a=>a.nm===o.nm));
}
function rosterBrand(){let s=0,n=0;ROLE_ORDER.forEach(r=>{if(G.roster[r]){s+=G.roster[r].attributes.brand.starPower;n++;}});return n?s/n:0;}

/* -------- actions -------- */
function doScout(id){
  const e=G.ladder.find(x=>x.id===id);if(!e||G.scoutPts<=0||e.signed)return;
  G.scoutPts--; e.scout.conf=Math.min(1,e.scout.conf+0.2);
  const before=e.scout.revealed.length;
  e.scout.revealed=S.revealedFlags(e,e.scout.conf);
  if(e.scout.revealed.length>before){
    const nf=e.scout.revealed[e.scout.revealed.length-1];
    const m=FLAG_META[nf];toast('Scouting revealed <b>'+m.label+'</b> on '+e.handle+' — '+m.tip,m.cls==='good'?'good':m.cls==='bad'?'bad':'');
    pushLog('Analyst read <b>'+m.label+'</b> on '+e.handle+' ('+TIER_NAME[e.tier]+').',m.cls);
  }
  render();
}
function doSign(id,role){
  const e=G.ladder.find(x=>x.id===id);if(!e||e.signed)return;
  role=role||e.roleGuess;
  if(G.roster[role]){toast('That role is already filled — release the '+ROLE_LABEL[role]+' first.','bad');return;}
  const fee=signingFee(e);
  if(G.cash<fee){toast('Not enough credits ('+fee+'◈ needed).','bad');return;}
  G.cash-=fee; e.signed=true;
  const p=e.hidden.player; p.ladder=e; p.signedRole=role;
  if(!p.championPool||!Object.keys(p.championPool).length)S.seedPool(p,new S.Rng(G.seed,'pool:'+p.id));
  G.roster[role]=p; recomputeChem();
  pushLog('Signed <b>'+e.handle+'</b> ('+ROLE_LABEL[role]+', '+TIER_NAME[e.tier]+') for '+fee+'◈.','good');
  toast('Signed <b>'+e.handle+'</b> as your '+ROLE_LABEL[role]+'.','good');
  render();
}
function doRelease(role){
  const p=G.roster[role];if(!p)return;
  if(p.ladder)p.ladder.signed=false;
  G.roster[role]=null;recomputeChem();
  pushLog('Released the '+ROLE_LABEL[role]+', '+p.name+'.','info');render();
}
function advanceWeek(){
  G.week++;
  // gel chemistry (scrims)
  if(G.chem)S.rampWeek(G.chem,lineup(),1.0);
  // ladder churn: drift toward steady, boosted decay, mild noise
  const rng=new S.Rng(G.seed,'churn:'+G.week);
  G.ladder.forEach(e=>{
    if(e.signed)return;
    const step=0.12; e.mmr=Math.round(e.mmr+(e.hidden.steady-e.mmr)*step+rng.range(-25,25));
    e.tier=S.tierFromMmr(e.mmr).key; e.division=S.divFromMmr(e.mmr);
  });
  // fatigue / sharpness
  ROLE_ORDER.forEach(r=>{const p=G.roster[r];if(p){p.state.fatigue=S.clamp(p.state.fatigue+3,0,100);p.state.sharpness=S.clamp(p.state.sharpness+2,0,100);}});
  // sponsor income
  let inc=0;G.sponsors.active.forEach(s=>inc+=s.weekly);
  if(inc>0){G.cash+=inc;}
  G.scoutPts=G.scoutBudget;
  if(G.week%2===0)refreshSponsorOffers();
  pushLog('Week '+G.week+' — scrims run'+(inc>0?', +'+inc.toFixed(1)+'◈ sponsor income':'')+'. Scouting budget refreshed.','info');
  render();
}
function makeOpponent(){
  const st=stage();const rng=new S.Rng(G.seed,'opp:'+G.stageIndex+':'+G.stageWins);
  const names=['Ashfall','Kestrel','Meridian B','Onyx Guard','Riptide','Vantablack','Zephyr','Ironclad','Sunder','Halcyon','Nightfall','Gravel'];
  const nm=names[(G.stageIndex*3+G.stageWins)%names.length];
  const lu={};ROLE_ORDER.forEach(role=>{lu[role]=S.genPlayer(rng,{id:'opp'+role,region:rng.pick(['mer','kyo','tia','van']),qualityCenter:st.oppCenter+rng.range(-4,4),primaryRole:role,ageRange:[19,26]});lu[role].languageIds=['common'];});
  let ch=S.initChem(lu);const wk=Math.round(rng.range(6,26));for(let i=0;i<wk;i++)S.rampWeek(ch,lu,1);
  return {name:nm,lineup:lu,chem:ch};
}
/* playMatch → matchday.js (startSeries / concludeSeries) */
function advanceWeekQuiet(){ // a match consumes a week without the separate log line
  G.week++;if(G.chem)S.rampWeek(G.chem,lineup(),1.0);
  ROLE_ORDER.forEach(r=>{const p=G.roster[r];if(p){p.state.fatigue=S.clamp(p.state.fatigue+5,0,100);}});
  let inc=0;G.sponsors.active.forEach(s=>inc+=s.weekly);G.cash+=inc;G.scoutPts=G.scoutBudget;
}
function acceptSponsor(id){
  const o=G.sponsors.offers.find(x=>x.id===id);if(!o)return;
  G.cash+=o.base;G.sponsors.active.push({nm:o.nm,weekly:o.weekly,clause:o.clause});
  G.sponsors.offers=G.sponsors.offers.filter(x=>x.id!==id);
  pushLog('Signed sponsor <b>'+o.nm+'</b> (+'+o.base+'◈ now, +'+o.weekly+'◈/wk).','good');
  toast('Sponsor secured: '+o.nm,'good');render();
}

/* ============================================================= rendering ============================================================= */
function render(){
  renderStats();renderNav();renderPyramid();
  const scr=G.ui.screen;
  const main=$('#main');main.innerHTML='';
  if(scr==='scout')renderScout(main);
  else if(scr==='squad')renderSquad(main);
  else if(scr==='compete')renderCompete(main);
  else if(scr==='sponsors')renderSponsors(main);
}
function renderStats(){
  const s=$('#stats');s.innerHTML='';
  const items=[['Week',G.week,''],['Credits',fmt(G.cash)+'◈','gold'],['Reputation',Math.round(G.reputation),''],['Scouting',G.scoutPts+'/'+G.scoutBudget,'']];
  items.forEach(([k,v,c])=>{const d=el('div','stat');d.innerHTML='<span class="k">'+k+'</span><span class="v '+c+'">'+v+'</span>';s.appendChild(d);});
}
function renderNav(){
  document.querySelectorAll('.nav[data-screen]').forEach(n=>n.classList.toggle('active',n.dataset.screen===G.ui.screen));
  $('#nb-scout').textContent=G.ladder.filter(e=>!e.signed&&e.scout.conf>0).length||'0';
  $('#nb-squad').textContent=rosterCount()+'/5';
  $('#nb-sponsors').textContent=G.sponsors.offers.length||'0';
}
function renderPyramid(){
  const p=$('#pyr');p.innerHTML='';
  STAGES.forEach((st,i)=>{
    const cls=i<G.stageIndex?'done':i===G.stageIndex?'cur':'';
    const d=el('div','step '+cls);d.innerHTML='<span class="dot"></span><span>'+st.name+'</span>';
    p.appendChild(d);
  });
}

/* ---------- scout ---------- */
function renderScout(main){
  const head=el('div','screen-head');
  head.innerHTML='<p class="eyebrow">Talent discovery</p><h1 class="title cond">Scout the Ladder</h1>'+
    '<p class="sub">Rank is public; true skill is not. Spend scouting to narrow the fog and surface the flags — a smurf hiding in Jade is the bargain of the season; a boosted Ascendant is the trap.</p>';
  main.appendChild(head);

  const grid=el('div','scout-grid');
  // left: table + toolbar
  const left=el('div');
  const bar=el('div','toolbar');
  bar.innerHTML='<span class="section-label" style="margin:0">Home &amp; reachable ladders</span>';
  const spacer=el('span');spacer.style.flex='1';bar.appendChild(spacer);
  const roleSel=el('select');roleSel.innerHTML='<option value="">All roles</option>'+ROLE_ORDER.map(r=>'<option value="'+r+'">'+ROLE_LABEL[r]+'</option>').join('');
  roleSel.value=G.ui.scoutRole||'';roleSel.onchange=()=>{G.ui.scoutRole=roleSel.value;render();};
  bar.appendChild(roleSel);
  left.appendChild(bar);

  const cardT=el('div','card');cardT.style.overflow='hidden';cardT.style.padding='6px 8px 8px';
  const tbl=el('table','ladder');
  tbl.innerHTML='<thead><tr><th>Prospect</th><th>Rank</th><th>Role</th><th>Age</th><th>Games</th><th>WR</th><th>Read</th></tr></thead>';
  const tb=el('tbody');
  let rows=G.ladder.filter(e=>!G.ui.scoutRole||e.roleGuess===G.ui.scoutRole);
  rows.forEach(e=>{
    const tr=el('tr');if(e.id===G.ui.selLad)tr.classList.add('sel');if(e.signed)tr.classList.add('signed');
    tr.onclick=()=>{G.ui.selLad=e.id;render();};
    const pr=potentialRead(e.hidden.potential,e.scout.conf);
    const flags=e.scout.revealed.map(f=>'<span class="pill '+FLAG_META[f].cls+'">'+FLAG_META[f].label+'</span>').join('');
    tr.innerHTML=
      '<td><div class="handle">'+e.handle+'</div>'+(flags?'<div class="flagline">'+flags+'</div>':'')+'</td>'+
      '<td>'+gemBadge(e.tier)+'<div class="role-tag" style="margin-top:2px">'+(e.tier==='ascendant'||e.tier==='paragon'||e.tier==='apex'?fmt(e.mmr)+' mmr':'Div '+toRoman(e.division))+'</div></td>'+
      '<td><span class="role-tag">'+ROLE_LABEL[e.roleGuess]+'</span></td>'+
      '<td class="mono">'+e.age+'</td>'+
      '<td class="mono">'+e.games+'</td>'+
      '<td class="wr">'+Math.round(e.winRate*100)+'%</td>'+
      '<td>'+(e.signed?'<span class="role-tag">signed</span>':pr.label==='?'?'<span class="role-tag" style="color:var(--faint)">— unscouted</span>':'<span class="pill">'+cap(pr.label)+'</span>')+'</td>';
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);cardT.appendChild(tbl);left.appendChild(cardT);
  grid.appendChild(left);

  // right: detail
  const det=el('div','card detail');
  const e=G.ladder.find(x=>x.id===G.ui.selLad);
  if(!e){det.innerHTML='<div class="empty">Select a prospect to scout.</div>';}
  else renderScoutDetail(det,e);
  grid.appendChild(det);
  main.appendChild(grid);
}
function renderScoutDetail(det,e){
  const p=e.hidden.player, conf=e.scout.conf;
  const dh=el('div','dh');
  const pr=potentialRead(e.hidden.potential,conf);
  dh.innerHTML='<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">'+
    '<div><div class="handle" style="font-size:24px">'+e.handle+'</div>'+
    '<div class="role-tag" style="margin-top:3px">'+ROLE_LABEL[e.roleGuess]+' · '+REGION_NAME[e.region]+' · age '+e.age+'</div></div>'+
    gemBadge(e.tier,true)+'</div>'+
    '<div class="flagline" style="margin-top:10px">'+
      (e.scout.revealed.length?e.scout.revealed.map(f=>'<span class="pill '+FLAG_META[f].cls+'" title="'+FLAG_META[f].tip+'">'+FLAG_META[f].label+'</span>').join(''):'<span class="role-tag" style="color:var(--faint)">no flags surfaced yet</span>')+
    '</div>';
  det.appendChild(dh);

  const db=el('div','db');
  // scouting control
  const sc=el('div');
  sc.innerHTML='<div class="fog-row"><div class="lab"><span class="nm">Scouting confidence</span><span class="rd">'+Math.round(conf*100)+'% · '+pr.conf+'</span></div>'+
    '<div class="confbar"><i style="width:'+(conf*100)+'%"></i></div></div>';
  db.appendChild(sc);
  const scoutBtn=el('button','btn ghost');scoutBtn.style.width='100%';scoutBtn.style.marginBottom='14px';
  scoutBtn.innerHTML='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg> Scout ('+(e.signed?'signed':G.scoutPts>0?'−1 pt':'no points')+')';
  scoutBtn.disabled=e.signed||G.scoutPts<=0||conf>=1;
  scoutBtn.onclick=()=>doScout(e.id);
  db.appendChild(scoutBtn);

  // fogged attributes
  const attrs=[['Mechanics',p.attributes.mechanical.mechanics],['Laning',p.attributes.mechanical.laning],
    ['Teamfighting',p.attributes.mechanical.teamfighting],['Map Awareness',p.attributes.gameKnowledge.mapAwareness],
    ['Composure',p.attributes.mental.composure]];
  const al=el('div');al.innerHTML='<div class="section-label">Scouted attributes</div>';
  attrs.forEach(([nm,tv])=>{
    const [lo,hi]=scoutedRange(tv,conf);const exact=(hi-lo)<1;
    const row=el('div','fog-row');
    row.innerHTML='<div class="lab"><span class="nm">'+nm+'</span><span class="rd">'+(exact?Math.round(tv):Math.round(lo)+'–'+Math.round(hi))+'</span></div>'+
      '<div class="track"><div class="band'+(exact?' exact':'')+'" style="left:'+lo+'%;right:'+(100-hi)+'%"></div>'+(exact?'<div class="mark" style="left:'+tv+'%"></div>':'')+'</div>';
    al.appendChild(row);
  });
  db.appendChild(al);

  // potential + archetype
  const meta=el('div');meta.style.margin='12px 0';
  meta.innerHTML='<div class="fog-row"><div class="lab"><span class="nm">Potential ceiling</span><span class="rd">'+(pr.label==='?'?'unknown':cap(pr.label))+' · '+pr.conf+'</span></div></div>'+
    '<div class="fog-row"><div class="lab"><span class="nm">Plays</span><span class="rd">'+ARCH_LABEL[e.topArch]+'</span></div></div>';
  db.appendChild(meta);

  // sign
  const fee=signingFee(e);
  const roleOpen=!G.roster[e.roleGuess];
  const signBtn=el('button','btn primary');signBtn.style.width='100%';
  signBtn.textContent=e.signed?'Signed to your roster':(roleOpen?'Sign as '+ROLE_LABEL[e.roleGuess]+' — '+fee+'◈':ROLE_LABEL[e.roleGuess]+' slot is full');
  signBtn.disabled=e.signed||!roleOpen||G.cash<fee;
  signBtn.onclick=()=>doSign(e.id);
  db.appendChild(signBtn);
  if(!e.signed&&roleOpen&&G.cash<fee){const w=el('div','role-tag');w.style.cssText='color:var(--toxic);margin-top:6px;text-align:center';w.textContent='Need '+fee+'◈ — you have '+Math.round(G.cash)+'◈';db.appendChild(w);}
  det.appendChild(db);
}

/* ---------- squad ---------- */
function renderSquad(main){
  const head=el('div','screen-head');
  head.innerHTML='<p class="eyebrow">Roster · chemistry</p><h1 class="title cond">Squad &amp; Chemistry</h1>'+
    '<p class="sub">Five players are not a team. Chemistry builds every week you keep a lineup together and resets on the pairs a new signing touches — a superstar can make you worse the day they arrive.</p>';
  main.appendChild(head);

  const grid=el('div','squad-grid');
  // left: slots
  const slots=el('div','slot-row');
  ROLE_ORDER.forEach(role=>{
    const p=G.roster[role];
    if(!p){
      const empty=el('div','slot-empty');
      empty.innerHTML='<div><span class="role-tag" style="color:var(--gold)">'+ROLE_LABEL[role]+'</span><div style="font-size:12px;margin-top:2px">Empty seat</div></div>';
      const b=el('button','btn ghost');b.textContent='Scout a '+ROLE_LABEL[role];b.onclick=()=>{G.ui.screen='scout';G.ui.scoutRole=role;render();};
      empty.appendChild(b);slots.appendChild(empty);
    } else {

    '<span class="mono" style="margin-left:auto;font-weight:600;font-size:20px">'+S.clockOf(t)+'</span>';
  left.appendChild(sb);
  const ctrl=el('div'); ctrl.style.cssText='display:flex;gap:10px;align-items:center;margin-bottom:12px';
  const pl=el('span','role-tag'); pl.textContent=done?'game over':'pace'; ctrl.appendChild(pl); if(!done)ctrl.appendChild(paceSeg());
  ctrl.insertAdjacentHTML('beforeend','<span class="mono" style="margin-left:auto;font-size:11px;color:var(--muted)">'+g.verdict.you.label+' vs '+g.verdict.them.label+'</span>');
  left.appendChild(ctrl);
  // win prob
  const n=g.ticks.length; const pts=g.ticks.slice(0,Math.max(1,idx)).map(tk=>tk.winProbA*100);
  const poly=pts.map((v,i)=>(((i+1)/n)*620+10).toFixed(1)+','+(110-v).toFixed(1)).join(' ');
  const wpNow=pts.length?pts[pts.length-1]:50;
  const wp=el('div','wp-card');
  wp.innerHTML='<div style="display:flex;align-items:baseline"><span class="role-tag" style="font-size:9px;letter-spacing:.14em">WIN PROBABILITY</span><span class="cond" style="margin-left:auto;font-weight:700;font-size:22px;color:'+(wpNow>=50?'var(--gel)':'var(--toxic)')+'">'+Math.round(wpNow)+'%</span></div>'+
    '<svg viewBox="0 0 640 120" width="100%" height="120" role="img" aria-label="Win probability over the game"><line x1="10" y1="60" x2="630" y2="60" stroke="var(--line)" stroke-dasharray="3 4"/>'+(pts.length>1?'<polyline points="'+poly+'" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>':'')+'<circle cx="'+((Math.max(1,idx)/n)*620+10).toFixed(1)+'" cy="'+(110-wpNow).toFixed(1)+'" r="4" fill="var(--gold)"/></svg>';
  left.appendChild(wp);
  // timeline (latest events)
  const evs=[]; g.ticks.slice(0,idx).forEach(tk=>tk.events.forEach(e=>evs.push({t:tk.t,e:e})));
  const tl=el('div','tl-card'); tl.innerHTML='<div class="role-tag" style="font-size:9px;letter-spacing:.14em;margin-bottom:6px">TIMELINE</div>';
  const show=evs.slice(-10); if(evs.length>10)tl.insertAdjacentHTML('beforeend','<div class="role-tag" style="font-size:9px;color:var(--faint);margin-bottom:4px">… '+(evs.length-10)+' earlier moments</div>');
  if(!show.length) tl.insertAdjacentHTML('beforeend','<div class="tl-ev"><span class="ts">0:00</span><span>Both teams load in. Laning phase.</span></div>');
  show.forEach((x,i)=>{ const hl=x.e.type!=='kill'&&x.e.type!=='bastion'; const d=el('div','tl-ev'+(hl?' hl':'')+(x.e.side==='a'?' us':'')); if(i===show.length-1){d.style.animation='reveal .35s forwards';d.style.opacity='0';} d.innerHTML='<span class="ts">'+S.clockOf(x.t)+'</span><span>'+esc(x.e.text)+'</span>'; tl.appendChild(d); });
  left.appendChild(tl);
  if(done){
    const bn=el('div','banner');
    bn.innerHTML='<div class="big" style="color:'+(won?'var(--gel)':'var(--toxic)')+'">'+(won?'GAME '+(m.gameIndex+1)+' — VICTORY':'GAME '+(m.gameIndex+1)+' — DEFEAT')+'</div><div class="mono" style="color:var(--muted);font-size:12px">'+g.lengthMin+' min · '+g.killsA+'–'+g.killsB+' · MVP <span class="mvp">'+esc(g.mvp.name)+'</span></div>';
    const yw=m.games.filter(x=>x.winner==='a').length, ow=m.games.length-yw; const over=yw>=2||ow>=2;
    const b=el('button','btn primary'); b.style.marginLeft='auto'; b.textContent=over?'Finish series ▸':'Next game ▸'; b.onclick=nextGame; bn.appendChild(b);
    left.appendChild(bn);
    const why=el('div','card'); why.style.padding='12px 16px';
    const bd=g.breakdown; const dA=bd.a.strength-bd.b.strength; const de=g.verdict.you.score-g.verdict.them.score;
    why.innerHTML='<div class="section-label">Why it went this way</div><div class="vgrid" style="margin-top:0"><div>'+
      '<div class="k"><span>Draft</span><b style="color:'+(de>=0?'var(--gel)':'var(--toxic)')+'">'+(de>=0?'+':'')+de.toFixed(1)+'</b></div>'+
      '<div class="k"><span>Team synergy (mesh ×'+bd.a.meshMult.toFixed(3)+' vs ×'+bd.b.meshMult.toFixed(3)+')</span><b>'+((bd.a.meshMult-bd.b.meshMult)*100>=0?'+':'')+((bd.a.meshMult-bd.b.meshMult)*100).toFixed(1)+'%</b></div>'+
      '<div class="k"><span>Roster base strength</span><b>'+bd.a.base.toFixed(1)+' vs '+bd.b.base.toFixed(1)+'</b></div></div>'+
      '<div><div class="k"><span>Final strength gap</span><b style="color:'+(dA>=0?'var(--gel)':'var(--toxic)')+'">'+(dA>=0?'+':'')+dA.toFixed(1)+'</b></div><div class="k"><span>Pre-game win probability</span><b>'+Math.round(g.winProbA*100)+'%</b></div><div class="k"><span>Result</span><b>'+((won&&g.winProbA>=0.5)||(!won&&g.winProbA<0.5)?'held':'upset')+'</b></div></div></div>';
    left.appendChild(why);
    const sl=el('table','statline'); sl.innerHTML='<thead><tr><th>Your player</th><th>K</th><th>D</th><th>A</th><th>DMG%</th><th>Rating</th></tr></thead>';
    const tb=el('tbody'); ROLE_ORDER.forEach(r=>{ const line=g.linesA.find(l=>l.role===r); if(!line)return; const tr=el('tr'); const mv=(g.mvp.side==='a'&&g.mvp.name===line.name); tr.innerHTML='<td>'+(mv?'<span class="mvp">★ </span>':'')+ROLE_LABEL[r]+' · '+esc(line.name)+'</td><td>'+line.kills+'</td><td>'+line.deaths+'</td><td>'+line.assists+'</td><td>'+Math.round(line.dmgShare*100)+'</td><td style="color:'+ratingColor(line.rating)+'">'+line.rating.toFixed(1)+'</td>'; tb.appendChild(tr); });
    sl.appendChild(tb); const sc=el('div','card'); sc.style.cssText='padding:10px 14px;margin-top:12px'; sc.innerHTML='<div class="section-label">Your box score</div>'; sc.appendChild(sl); left.appendChild(sc);
  }
  live.appendChild(left);
  const rail=el('div'); rail.style.cssText='display:flex;flex-direction:column;gap:12px';
  const cm=el('div','crowd-card'); cm.style.minHeight='230px'; cm.appendChild(commsBlock()); rail.appendChild(cm);
  const cc=el('div','crowd-card'); cc.style.minHeight='320px'; cc.appendChild(crowdBlock()); cc.insertAdjacentHTML('beforeend','<div class="mono" style="border-top:1px solid var(--line-soft);margin-top:8px;padding-top:6px;font-size:9px;color:var(--faint)">'+(8000+Math.round(G.reputation*140)).toLocaleString()+' watching · slow mode off</div>'); rail.appendChild(cc);
  live.appendChild(rail);
  main.appendChild(live);
}
function seriesSummaryCard(mt){
  const st2=el('div','card'); st2.style.padding='16px';
  let pips=''; mt.series.games.forEach((gm,i)=>{ const w=gm.winner==='a'; pips+='<div class="gpip '+(w?'win':'loss')+'">Game '+(i+1)+'<div style="font-family:Barlow Condensed;font-weight:700;font-size:18px">'+(w?'W':'L')+'</div><div class="mono" style="font-size:10px">'+gm.killsA+'–'+gm.killsB+' · '+gm.lengthMin+'m</div></div>'; });
  const last=mt.series.games[mt.series.games.length-1];
  st2.innerHTML='<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;flex-wrap:wrap;gap:8px"><div class="section-label" style="margin:0">Last series · vs '+esc(mt.opp.name)+'</div>'+
    '<div class="cond" style="font-weight:700;font-size:22px;color:'+(mt.won?'var(--gel)':'var(--toxic)')+'">'+(mt.won?'VICTORY':'DEFEAT')+' '+mt.series.scoreA+'–'+mt.series.scoreB+'</div></div><div class="games">'+pips+'</div>'+
    '<div class="mono" style="font-size:11px;color:var(--muted);margin-top:8px">Deciding game MVP: <span class="mvp">'+esc(last.mvp.name)+'</span> · draft edges: '+mt.series.games.map(g=>(g.verdict.you.score-g.verdict.them.score>=0?'+':'')+(g.verdict.you.score-g.verdict.them.score).toFixed(1)).join(' / ')+'</div>';
  return st2;
}
function renderSeries(main){
  const m=G.match; const mt=G.ui.match;
  const head=el('div','screen-head');
  head.innerHTML='<p class="eyebrow">'+stage().name+'</p><h1 class="title cond">Series '+(mt.won?'won':'lost')+'</h1><p class="sub">'+(mt.won?'The crowd goes home happy. Chemistry keeps building; the next opponent is already scouting you.':'It happens. Chemistry still gelled this week — and you learned what the draft cost you.')+'</p>';
  main.appendChild(head);
  main.appendChild(seriesSummaryCard(mt));
  const row=el('div'); row.style.cssText='display:flex;gap:10px;margin-top:14px;flex-wrap:wrap';
  const b=el('button','btn primary'); b.textContent='Continue ▸'; b.onclick=endSeriesView; row.appendChild(b); main.appendChild(row);
  const g2=el('div','grid-2'); g2.style.marginTop='14px';
  const c1=el('div','card'); c1.style.padding='12px 14px'; c1.appendChild(commsBlock()); const c2=el('div','card'); c2.style.padding='12px 14px'; c2.appendChild(crowdBlock()); g2.appendChild(c1); g2.appendChild(c2); main.appendChild(g2);
}



/* ---------- sponsors ---------- */
function renderSponsors(main){
  const head=el('div','screen-head');
  head.innerHTML='<p class="eyebrow">Money · brand</p><h1 class="title cond">Sponsors</h1><p class="sub">Salaries are oxygen. Sponsor offers scale with your reputation and your roster’s star power — bigger stage, bigger cheques, heavier clauses.</p>';
  main.appendChild(head);

  const g2=el('div','grid-2');
  // offers
  const offCol=el('div');
  offCol.innerHTML='<div class="section-label">Available offers · reputation '+Math.round(G.reputation)+'</div>';
  if(!G.sponsors.offers.length)offCol.insertAdjacentHTML('beforeend','<div class="card"><div class="empty-note">No offers right now. Win matches and grow your reputation to attract bigger brands.</div></div>');
  const og=el('div','sponsor-grid');
  G.sponsors.offers.forEach(o=>{
    const c=el('div','card sponsor');
    c.innerHTML='<div style="display:flex;justify-content:space-between;align-items:flex-start"><div class="snm">'+o.nm+'</div><span class="pill '+(o.tier>=3?'gold':o.tier>=2?'info':'')+'">Tier '+(o.tier+1)+'</span></div>'+
      '<div class="flav">'+o.flav+'</div>'+
      '<div class="terms"><div class="t"><span>Signing bonus</span><b>+'+o.base+'◈</b></div><div class="t"><span>Weekly</span><b>+'+o.weekly.toFixed(1)+'◈</b></div>'+
      (o.clause?'<div class="t"><span>Clause</span><b>'+o.clause+'</b></div>':'')+
      (o.ob?'<div class="t"><span>Obligation</span><b>'+o.ob+'</b></div>':'')+'</div>';
    const b=el('button','btn primary');b.style.marginTop='auto';b.textContent='Sign deal (+'+o.base+'◈)';b.onclick=()=>acceptSponsor(o.id);
    c.appendChild(b);og.appendChild(c);
  });
  offCol.appendChild(og);g2.appendChild(offCol);

  // active
  const actCol=el('div');
  actCol.innerHTML='<div class="section-label">Active deals · +'+G.sponsors.active.reduce((s,a)=>s+a.weekly,0).toFixed(1)+'◈ / week</div>';
  if(!G.sponsors.active.length)actCol.insertAdjacentHTML('beforeend','<div class="card"><div class="empty-note">No active sponsors yet.</div></div>');
  G.sponsors.active.forEach(a=>{const c=el('div','card sponsor');c.style.marginBottom='12px';
    c.innerHTML='<div class="snm">'+a.nm+'</div><div class="terms"><div class="t"><span>Weekly income</span><b>+'+a.weekly.toFixed(1)+'◈</b></div>'+(a.clause?'<div class="t"><span>Clause</span><b>'+a.clause+'</b></div>':'')+'</div>';
    actCol.appendChild(c);});
  g2.appendChild(actCol);
  main.appendChild(g2);
}

/* ---------- small helpers ---------- */
function logList(){const l=el('div','log');G.inbox.slice(0,10).forEach(m=>{const d=el('div','li');d.innerHTML='<span class="wk">wk '+m.week+'</span><span class="tx">'+m.text+'</span>';l.appendChild(d);});if(!G.inbox.length)l.innerHTML='<div class="empty-note">Nothing yet.</div>';return l;}
function gemBadge(tier,big){return '<span class="gem" style="'+(big?'font-size:13px':'')+'"><i style="background:'+TIER_HUE[tier]+'"></i>'+TIER_NAME[tier]+'</span>';}
function chemBand(v){if(v<30)return{label:'Toxic',color:'var(--toxic)'};if(v<50)return{label:'Cold',color:'#8794a4'};if(v<70)return{label:'Warming',color:'var(--gold)'};if(v<85)return{label:'Solid',color:'#78c9a0'};return{label:'Locked-in',color:'var(--gel)'};}
function cohesionLabel(c){if(c<30)return{text:'Fractured',color:'var(--toxic)'};if(c<45)return{text:'Loose',color:'#b0836a'};if(c<60)return{text:'Functional',color:'var(--gold)'};if(c<75)return{text:'Cohesive',color:'#78c9a0'};return{text:'Unbreakable',color:'var(--gel)'};}
function ovColor(o){if(o<50)return'var(--muted)';if(o<65)return'var(--ink)';if(o<78)return'var(--gold)';return'var(--gel)';}
function ratingColor(r){if(r<4)return'var(--toxic)';if(r<6)return'var(--muted)';if(r<8)return'var(--ink)';return'var(--gold)';}
function toRoman(n){return['','I','II','III','IV'][n]||n;}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

/* ---------- wiring ---------- */
document.querySelectorAll('.nav[data-screen]').forEach(n=>n.onclick=()=>{G.ui.screen=n.dataset.screen;render();});
$('#newGameBtn').onclick=()=>{if(confirm('Start a fresh career? Current progress is lost.'))newGame();};
$('#themeBtn').onclick=()=>{
  const root=document.documentElement;const cur=root.getAttribute('data-theme');
  const next=cur==='dark'?'light':cur==='light'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark');
  root.setAttribute('data-theme',next);
};
newGame();
</script>
